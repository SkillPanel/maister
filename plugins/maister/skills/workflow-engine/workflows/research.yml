# The research workflow, as a graph.
#
# Six nodes named for what they do and three named for what they approve, in
# one linear chain. The branching a reader might expect — brainstorming on or
# off, design on or off — is carried entirely by the per-node `when` guards
# plus the rule that a node whose guard is false is skipped and still satisfies
# everything downstream. There is no routing construct here because the grammar
# has none and none is needed.
#
# No node carries `on:`. Under the default, a `needs` entry is satisfied by a
# completed or a skipped predecessor but never by a stopped one, which is what
# makes each gate's stop option actually end the run: nothing after it is ever
# ready.
#
# Target names are bare on purpose. Resolution is rooted at the plugin root and
# the provider prefix is applied at invocation, so this one file is correct
# under every generated variant without a rewrite.
#
# The node prose lives beside this file in `research.md`, one section per node
# id. Every `direct:` node is executed from its section there, and the operator
# questions asked inside those nodes appear only in that prose — a reader of
# this file alone cannot see them, and neither can the generated diagram.
name: research
version: 1
inputs:
  question: {type: string, required: true}
  research_type: {type: string, required: false}
  # Tri-state, and a string rather than a bool for that reason: absent means
  # ask the operator, `yes`/`no` means the flag was set. Never referenced from
  # a `when` clause — the decision node turns it into a declared bool first.
  brainstorm: {type: string, required: false}
  design: {type: string, required: false}
  embedded: {type: bool, required: false, default: false}
nodes:
  research-foundation:
    uses: direct:research-foundation
    needs: []
    with:
      question: "${inputs.question}"
      research_type: "${inputs.research_type}"
    outputs:
      artifacts:
        brief: planning/research-brief.md
        plan: planning/research-plan.md
        sources: planning/sources.md
        findings: analysis/findings
        synthesis: analysis/synthesis.md
        report: outputs/research-report.md
      values:
        confidence_level: {enum: [high, medium, low]}

  foundation-approval:
    type: gate
    needs: [research-foundation]
    ask: "Research foundation complete (initialized, planned, gathered, synthesized). Continue to brainstorming evaluation?"
    options:
      continue-to-evaluation: continue
      stop-research: stop

  optional-phases-decision:
    uses: direct:optional-phases-decision
    needs: [foundation-approval]
    with:
      synthesis: "${research-foundation.artifacts.synthesis}"
      brainstorm_flag: "${inputs.brainstorm}"
      design_flag: "${inputs.design}"
    outputs:
      values:
        brainstorming_enabled: bool
        design_enabled: bool

  solution-generation:
    uses: agent:solution-brainstormer
    needs: [optional-phases-decision]
    when: "${optional-phases-decision.values.brainstorming_enabled}"
    with:
      synthesis: "${research-foundation.artifacts.synthesis}"
      research_report: "${research-foundation.artifacts.report}"
      output_path: outputs/solution-exploration.md
      research_type: "${inputs.research_type}"
      research_question: "${inputs.question}"
      confidence_level: "${research-foundation.values.confidence_level}"
    outputs:
      artifacts:
        exploration: outputs/solution-exploration.md

  solution-convergence:
    uses: direct:solution-convergence
    needs: [solution-generation]
    when: "${optional-phases-decision.values.brainstorming_enabled}"
    with:
      exploration: "${solution-generation.artifacts.exploration}"
    outputs:
      values:
        # A short identifier for the converged approach, not free text: the
        # full converged detail travels to the design node in the accumulated
        # phase summaries, exactly as it does in the prose workflow.
        selected_approach: id

  convergence-approval:
    type: gate
    needs: [solution-convergence]
    when: "${optional-phases-decision.values.brainstorming_enabled}"
    ask: "Brainstorming complete. Continue to high-level design?"
    options:
      continue-to-design: continue
      stop-research: stop

  high-level-design:
    uses: direct:high-level-design
    needs: [convergence-approval]
    when: "${optional-phases-decision.values.design_enabled}"
    with:
      synthesis: "${research-foundation.artifacts.synthesis}"
      research_report: "${research-foundation.artifacts.report}"
      exploration: "${solution-generation.artifacts.exploration}"
      selected_approach: "${solution-convergence.values.selected_approach}"
      research_type: "${inputs.research_type}"
      research_question: "${inputs.question}"
      confidence_level: "${research-foundation.values.confidence_level}"
    outputs:
      artifacts:
        design: outputs/high-level-design.md
        decision_log: outputs/decision-log.md

  design-approval:
    type: gate
    needs: [high-level-design]
    when: "${optional-phases-decision.values.design_enabled}"
    ask: "Design complete. Continue to output generation?"
    options:
      continue-to-completion: continue
      stop-research: stop

  completion:
    uses: direct:completion
    needs: [design-approval]
    when: "!${inputs.embedded}"
