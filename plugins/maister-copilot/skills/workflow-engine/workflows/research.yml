# The research workflow, as a graph.
#
# Five nodes named for what they do and three named for what they approve, in
# one linear chain. The branching a reader might expect — brainstorming on or
# off, design on or off — is carried entirely by the per-node `when` guards
# plus the rule that a node whose guard is false is skipped and still satisfies
# everything downstream. There is no routing construct here because the grammar
# has none and none is needed.
#
# The optional stretches are decided at the gates before them. The foundation
# gate offers one continue per way on — to brainstorming, to the design without
# brainstorming, or straight to the end — each setting the two values the
# guards read; the brainstorming gate then decides the design the same way. The
# operator approves the work and picks the way on in one question, so no node
# asks either choice. The node each gate closes says which continue it
# recommends and why.
#
# The design runs when either gate chose it, so its guard joins the two gate
# values with `||`: the foundation's when brainstorming was skipped — the
# brainstorming gate is then skipped too and reads false — and the brainstorming
# gate's when it ran.
#
# No node carries `on:`. Under the default, a `needs` entry is satisfied by a
# completed or a skipped predecessor but never by a stopped one, which is what
# makes each stop option actually end the run: nothing after it is ever ready.
# The foundation gate carries no stop. Its four options are the most its
# question holds, and finishing with the research is its way out, the final
# summary still written.
#
# The one way back is a revise option, and every gate carries one. The gates
# that close the research foundation and the high-level design send the run back
# to re-run that node with the operator's note. The convergence gate sends it back
# to the convergence alone, which re-asks only the decision areas the note
# reopens; the brainstorm before it is not run again, because its alternatives
# are what the areas choose between.
#
# Target names are bare on purpose. Resolution is rooted at the plugin root and
# the provider prefix is applied at invocation, so this one file is correct
# under every generated variant without a rewrite.
#
# The node prose lives beside this file in `research.md`, one section per node
# id. Every `direct:` node is executed from its section there, and the operator
# questions asked inside those nodes appear only in that prose — a reader of
# this file alone cannot see them, and neither can the generated diagram.
name: research
version: 1
description: "Answers a question by gathering evidence from the codebase, its documentation and the web, and synthesising it into a research report, optionally followed by solution brainstorming and a high-level design. Use it when the task is to investigate, compare options or decide an approach before any code is written, whether on its own or as a step inside another run."
inputs:
  question: {type: string, required: true}
  research_type: {type: string, required: false}
  # Tri-state, and a string rather than a bool for that reason: absent means
  # the run recommends from what it found, `yes`/`no` means the flag was set.
  # Neither decides anything: the gate before each stretch is always asked, and
  # a flag only sets which continue the node it closes recommends.
  brainstorm: {type: string, required: false}
  design: {type: string, required: false}
  # "This run is a sub-run of another run." The engine supplies it at the child
  # freeze; an operator never types it. Its only effect here is the guard on
  # `completion`, which a parent has no use for.
  embedded: {type: bool, required: false, default: false}

# What a parent may read. Every entry names an output some node already
# declares, so a key that stops resolving fails validation rather than a run.
# Three of the six artifacts belong to nodes a guard may skip: such an entry is
# simply absent, and the parent's missing-artifact rule decides what follows.
# `report` deliberately aliases `research_report` — chains authored against
# `${research.artifacts.report}` keep resolving.
outputs:
  artifacts:
    research_report: research-foundation.artifacts.report
    report: research-foundation.artifacts.report
    findings_directory: research-foundation.artifacts.findings
    solution_exploration: solution-generation.artifacts.exploration
    high_level_design: high-level-design.artifacts.design
    decision_log: high-level-design.artifacts.decision_log
  values:
    conclusions: research-foundation.values.conclusions

# What the dashboard draws beside each node. Definition data rather than graph
# data: the block sits outside `nodes:` and outside the hashed envelope, so
# adding or correcting a hint moves no `graph_hash` and drifts no frozen chain.
# The seven values are the closed set the viewer knows — `analysis`, `spec`,
# `plan`, `code`, `verify`, `docs`, `done` — and a writer picks the closest
# member rather than inventing one; anything else fails validation. Each gate
# carries the icon of the node it closes, so a stretch and the approval that
# closes it read as one pair. The same table lives in the prose beside this
# file.
display:
  icons:
    research-foundation:      analysis
    foundation-approval:      analysis
    solution-generation:      spec
    solution-convergence:     plan
    convergence-approval:     plan
    high-level-design:        spec
    design-approval:          spec
    completion:               done
  titles:
    research-foundation:      "Research foundation"
    foundation-approval:      "Approve research foundation"
    solution-generation:      "Solution brainstorming"
    solution-convergence:     "Solution convergence"
    convergence-approval:     "Approve brainstorming"
    high-level-design:        "High-level design"
    design-approval:          "Approve design"
    completion:               "Final summary"
  option_labels:
    # "Finish with the research" takes the place of a stop: the final summary
    # still runs, unless the run is embedded and simply ends.
    foundation-approval:
      continue-to-brainstorming: "Continue to brainstorming"
      continue-to-design: "Continue to the design, skip brainstorming"
      finish-with-research: "Finish with the research"
      revise-research: "Revise the research"
    convergence-approval:
      continue-to-design: "Continue to the design"
      finish-without-design: "Finish without a design"
      revise-convergence: "Ask the decision areas again"
      stop-research: "Stop here"
    # The final summary is skipped in an embedded run, which then finishes:
    # the label names no destination and the gate brief names the one that runs.
    design-approval:
      continue-to-completion: "Continue"
      revise-design: "Revise the design"
      stop-research: "Stop here"
  headers:
    foundation-approval:   "Research"
    convergence-approval:  "Solutions"
    design-approval:       "Design"

nodes:
  research-foundation:
    uses: direct:research-foundation
    needs: []
    with:
      question: "${inputs.question}"
      research_type: "${inputs.research_type}"
      # Read when this node writes its closing summary, to say which continue
      # of `foundation-approval` it recommends; not the research's input.
      brainstorm_flag: "${inputs.brainstorm}"
      design_flag: "${inputs.design}"
    outputs:
      artifacts:
        brief: planning/research-brief.md
        plan: planning/research-plan.md
        sources: planning/sources.md
        findings: analysis/findings
        synthesis: analysis/synthesis.md
        report: outputs/research-report.md
      values:
        confidence_level: {enum: [high, medium, low]}
        # A handle, not the content: the one-line conclusion of the research
        # this node reported, for a parent that reads the declared block
        # without opening the report. Flow-safe and short — a hyphenated
        # phrase inside the bare charset is preferred.
        conclusions: string

  foundation-approval:
    type: gate
    needs: [research-foundation]
    ask: "Research complete. Continue?"
    options:
      continue-to-brainstorming: {effect: continue, sets: {brainstorming_enabled: true, design_enabled: false}}
      continue-to-design: {effect: continue, sets: {brainstorming_enabled: false, design_enabled: true}}
      finish-with-research: {effect: continue, sets: {brainstorming_enabled: false, design_enabled: false}}
      revise-research: {effect: revise, reruns: research-foundation}

  solution-generation:
    uses: agent:solution-brainstormer
    needs: [foundation-approval]
    when: "${foundation-approval.values.brainstorming_enabled}"
    with:
      synthesis: "${research-foundation.artifacts.synthesis}"
      research_report: "${research-foundation.artifacts.report}"
      output_path: outputs/solution-exploration.md
      research_type: "${inputs.research_type}"
      research_question: "${inputs.question}"
      confidence_level: "${research-foundation.values.confidence_level}"
    outputs:
      artifacts:
        exploration: outputs/solution-exploration.md

  solution-convergence:
    uses: direct:solution-convergence
    needs: [solution-generation]
    when: "${foundation-approval.values.brainstorming_enabled}"
    with:
      exploration: "${solution-generation.artifacts.exploration}"
      # Read when this node writes its closing summary, to say which continue
      # of `convergence-approval` it recommends.
      design_flag: "${inputs.design}"
    outputs:
      values:
        # A short identifier for the converged approach, not free text: the
        # full converged detail travels to the design node in the accumulated
        # phase summaries, exactly as it does in the prose workflow.
        selected_approach: id

  convergence-approval:
    type: gate
    needs: [solution-convergence]
    when: "${foundation-approval.values.brainstorming_enabled}"
    ask: "Brainstorming complete. Continue?"
    options:
      continue-to-design: {effect: continue, sets: {design_enabled: true}}
      finish-without-design: {effect: continue, sets: {design_enabled: false}}
      revise-convergence: {effect: revise, reruns: solution-convergence}
      stop-research: stop

  high-level-design:
    uses: direct:high-level-design
    needs: [convergence-approval]
    when: "${foundation-approval.values.design_enabled} || ${convergence-approval.values.design_enabled}"
    with:
      synthesis: "${research-foundation.artifacts.synthesis}"
      research_report: "${research-foundation.artifacts.report}"
      exploration: "${solution-generation.artifacts.exploration}"
      selected_approach: "${solution-convergence.values.selected_approach}"
      research_type: "${inputs.research_type}"
      research_question: "${inputs.question}"
      confidence_level: "${research-foundation.values.confidence_level}"
    outputs:
      artifacts:
        design: outputs/high-level-design.md
        decision_log: outputs/decision-log.md

  design-approval:
    type: gate
    needs: [high-level-design]
    when: "${foundation-approval.values.design_enabled} || ${convergence-approval.values.design_enabled}"
    ask: "High-level design complete. Continue?"
    options:
      continue-to-completion: continue
      revise-design: {effect: revise, reruns: high-level-design}
      stop-research: stop

  completion:
    uses: direct:completion
    needs: [design-approval]
    when: "!${inputs.embedded}"
