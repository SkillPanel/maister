# The development workflow, as a graph.
#
# Fifteen nodes named for what they do and eleven named for what they approve,
# in one linear chain. Gates serialize the run, so a wider fan-in would buy
# nothing. The branching a reader might expect — a TDD pair on or off, mockups
# on or off, an audit, browser tests, a user guide — is carried entirely by the
# per-node `when` guards plus the rule that a node whose guard is false is
# skipped and still satisfies everything downstream. There is no routing
# construct here because the grammar has none and none is needed.
#
# A guard reads a value something recorded earlier: a node's declared value —
# the gap analysis's characteristics, the user-guide choice — or a value a
# gate's answer set. Two stretches are decided at the gate before them: the
# specification audit at `specification-approval` and the browser checks at
# `verification-approval`. Each of those gates has two continues, one per way
# on, each setting the value the stretch's guard reads, so the operator approves
# the work and decides the optional step in one question and the step itself
# asks nothing. The node the gate closes says which continue it recommends and
# why; the gate brief walks each continue on its own answer and names where it
# leads.
#
# A skip does not cascade, so the guard of a conditional stretch is repeated on
# every node of it, its closing gate included. A gate left unguarded would fire
# for a stretch that never ran.
#
# No node carries `on:`. Under the default, a `needs` entry is satisfied by a
# completed or a skipped predecessor but never by a stopped one, which is what
# makes each gate's stop option actually end the run: nothing after it is ever
# ready.
#
# The one way back is a revise option. The gates that close a document with no
# review loop of its own — the gap analysis, the mockups, the specification (at
# its own approval and after its audit) and the plan — can send the run back to
# re-run that node with the operator's note. Verification keeps its in-node fix
# loop instead.
#
# The plan has two gates, and exactly one of them is asked: the `publish`
# input picks which. `planning-approval` is the plain approval;
# `planning-approval-publish` asks the same question and its continue also
# grants the push of the run's branch and the pull request from it, which
# `finalization` acts on once there is something to publish. Both guards read
# an input, a choice made when the run started, so the gate not chosen is
# skipped. The two stand in line, the publishing one after the plain one, so
# the chain stays linear and the walk from either gate passes the other.
#
# The failing test written first has no approval of its own once it passes: the
# red-to-green evidence rides in the passing-test node's headline, which the
# verification checkpoint after it carries.
#
# Target names are bare on purpose. Resolution is rooted at the plugin root and
# the provider prefix is applied at invocation, so this one file is correct
# under every generated variant without a rewrite.
#
# The node prose lives beside this file in `development.md`, one section per
# node id. Every `direct:` node is executed from its section there, and the
# ten operator questions asked inside nodes, in eight asks, appear only in
# that prose — a reader of this file alone cannot see them, and neither can the
# generated diagram. The per-node recovery budgets live there too, never here: a
# budget written into `with:` would read like a grammar feature while being
# inert data the engine never consults.
name: development
version: 1
description: "Builds a change to the code — a new feature, an enhancement, a bug fix or a refactor — from analysis through specification, planning, implementation and verification, with an operator gate after each phase. Use it for any task that modifies code; the optional stretches (a failing test written before the fix, UI mockups, a specification audit, browser checks, user documentation) run only when the task calls for them."
inputs:
  task_description: {type: string, required: true}
  research: {type: string, required: false}
  # The path of a completed product-design task, or of its brief, whose brief
  # and mockups the intake copies in as the run's design context.
  design: {type: string, required: false}
  # The path of a high-level design document, or of a research task whose
  # outputs hold one; the intake copies it in, with the decision log beside it,
  # as constraints the specification and the plan work within.
  architecture: {type: string, required: false}
  # Tri-state, and a string rather than a bool for that reason: absent means
  # no flag was set, `yes`/`no` means it was. Never referenced from a `when`
  # clause. `user_docs` is turned into a declared bool by the node that reads
  # it; `audit` and `browser_tests` only decide which continue the gate that
  # decides their stretch recommends, because the gate is always asked.
  audit: {type: string, required: false}
  browser_tests: {type: string, required: false}
  user_docs: {type: string, required: false}
  sequential: {type: bool, required: false, default: false}
  # Whether approving the plan also publishes: the run pushes its own branch
  # and opens one pull request from it when it finishes. Off unless asked for.
  publish: {type: bool, required: false, default: false}

# What the dashboard draws beside each node. Definition data rather than graph
# data: the block sits outside `nodes:` and outside the hashed envelope, so
# adding or correcting a hint moves no `graph_hash` and drifts no frozen chain.
# The seven values are the closed set the viewer knows — `analysis`, `spec`,
# `plan`, `code`, `verify`, `docs`, `done` — and a writer picks the closest
# member rather than inventing one; anything else fails validation. Each gate
# carries the icon of the node it closes, so a stretch and the approval that
# closes it read as one pair. The same table lives in the prose beside this
# file.
display:
  icons:
    intake:                  analysis
    codebase-analysis:       analysis
    gap-analysis:            analysis
    gap-approval:            analysis
    tdd-red:                 verify
    tdd-red-approval:        verify
    ui-mockups:              spec
    mockup-approval:         spec
    specification:           spec
    specification-approval:  spec
    spec-audit:              verify
    spec-audit-approval:     verify
    planning:                plan
    planning-approval:       plan
    planning-approval-publish: plan
    implementation:          code
    implementation-approval: code
    tdd-green:               verify
    verification-options:    plan
    verification:            verify
    verification-approval:   verify
    e2e-verification:        verify
    e2e-approval:            verify
    user-docs:               docs
    docs-approval:           docs
    finalization:            done
  titles:
    intake:                  "Intake"
    codebase-analysis:       "Codebase analysis"
    gap-analysis:            "Gap analysis"
    gap-approval:            "Approve gap analysis"
    tdd-red:                 "Failing test"
    tdd-red-approval:        "Approve the failing test"
    ui-mockups:              "UI mockups"
    mockup-approval:         "Approve UI mockups"
    specification:           "Specification"
    specification-approval:  "Approve specification"
    spec-audit:              "Specification audit"
    spec-audit-approval:     "Approve specification audit"
    planning:                "Implementation planning"
    planning-approval:       "Approve implementation plan"
    planning-approval-publish: "Approve implementation plan and publish"
    implementation:          "Implementation"
    implementation-approval: "Approve implementation"
    tdd-green:               "Passing test"
    verification-options:    "Choosing the checks"
    verification:            "Verification"
    verification-approval:   "Approve verification"
    e2e-verification:        "Browser checks"
    e2e-approval:            "Approve browser checks"
    user-docs:               "User documentation"
    docs-approval:           "Approve documentation"
    finalization:            "Finalization"
  option_labels:
    # A continue label reading "Continue" alone is completed from the walk:
    # where these continue to depends on the guards after them, so their
    # labels name no destination and the gate brief names the one that runs.
    gap-approval:
      continue-past-analysis: "Continue"
      revise-gap-analysis: "Revise the gap analysis"
      stop-development: "Stop here"
    tdd-red-approval:
      continue-past-tdd-red: "Continue"
      stop-development: "Stop here"
    mockup-approval:
      continue-to-specification: "Continue to the specification"
      revise-mockups: "Revise the mockups"
      stop-development: "Stop here"
    specification-approval:
      continue-to-spec-audit: "Continue to the specification audit"
      continue-to-planning: "Continue to planning, skip the audit"
      revise-specification: "Revise the specification"
      stop-development: "Stop here"
    spec-audit-approval:
      continue-to-planning: "Continue to the implementation plan"
      revise-specification: "Revise the specification"
      stop-development: "Stop here"
    planning-approval:
      continue-to-implementation: "Continue to the implementation"
      revise-plan: "Revise the plan"
      stop-development: "Stop here"
    planning-approval-publish:
      continue-to-implementation: "Continue to the implementation"
      revise-plan: "Revise the plan"
      stop-development: "Stop here"
    implementation-approval:
      continue-past-implementation: "Continue"
      stop-development: "Stop here"
    verification-approval:
      continue-to-browser-checks: "Continue to the browser checks"
      continue-past-verification: "Continue without browser checks"
      stop-development: "Stop here"
    e2e-approval:
      continue-past-e2e: "Continue"
      stop-development: "Stop here"
    docs-approval:
      continue-to-finalization: "Continue to the final summary"
      stop-development: "Stop here"
  headers:
    gap-approval:             "Gap analysis"
    tdd-red-approval:         "Failing test"
    mockup-approval:          "UI mockups"
    specification-approval:   "Spec"
    spec-audit-approval:      "Spec audit"
    planning-approval:        "Plan"
    planning-approval-publish: "Plan"
    implementation-approval:  "Implemented"
    verification-approval:    "Verification"
    e2e-approval:             "Browser"
    docs-approval:            "User docs"

nodes:
  intake:
    uses: direct:intake
    needs: []
    with:
      task_description: "${inputs.task_description}"
      research: "${inputs.research}"
      design: "${inputs.design}"
      architecture: "${inputs.architecture}"
    outputs:
      artifacts:
        research_context: analysis/research-context
        design_index: analysis/design-context/INDEX.md
        architecture_context: analysis/architecture-context

  codebase-analysis:
    uses: skill:codebase-analyzer
    needs: [intake]
    with:
      task_description: "${inputs.task_description}"
      research_context: "${intake.artifacts.research_context}"
      design_index: "${intake.artifacts.design_index}"
    outputs:
      artifacts:
        analysis: analysis/codebase-analysis.md
        clarifications: analysis/clarifications.md

  gap-analysis:
    uses: agent:gap-analyzer
    needs: [codebase-analysis]
    with:
      task_description: "${inputs.task_description}"
      analysis: "${codebase-analysis.artifacts.analysis}"
      clarifications: "${codebase-analysis.artifacts.clarifications}"
      design_index: "${intake.artifacts.design_index}"
    outputs:
      artifacts:
        gap: analysis/gap-analysis.md
        scope: analysis/scope-clarifications.md
      values:
        # The three characteristics that decide the shape of the rest of the
        # run. The first two are guards; the third is state and dashboard
        # content, and it is a closed enum so it stays flow-safe.
        has_reproducible_defect: bool
        mockups_needed: bool
        risk_level: {enum: [high, medium, low]}

  gap-approval:
    type: gate
    needs: [gap-analysis]
    ask: "Gap analysis complete. Continue?"
    options:
      continue-past-analysis: continue
      revise-gap-analysis: {effect: revise, reruns: gap-analysis}
      stop-development: stop

  tdd-red:
    uses: direct:tdd-red
    needs: [gap-approval]
    when: "${gap-analysis.values.has_reproducible_defect}"
    with:
      task_description: "${inputs.task_description}"
      gap: "${gap-analysis.artifacts.gap}"
      analysis: "${codebase-analysis.artifacts.analysis}"
    outputs:
      artifacts:
        red_gate: implementation/tdd-red-gate.md

  tdd-red-approval:
    type: gate
    needs: [tdd-red]
    when: "${gap-analysis.values.has_reproducible_defect}"
    ask: "The failing test is written. Continue?"
    options:
      continue-past-tdd-red: continue
      stop-development: stop

  ui-mockups:
    uses: skill:mockup-studio
    needs: [tdd-red-approval]
    when: "${gap-analysis.values.mockups_needed}"
    with:
      output_subdir: analysis/design-context/mockups
      iteration: single
      emit_index_rows: true
      gap: "${gap-analysis.artifacts.gap}"
      scope: "${gap-analysis.artifacts.scope}"
      design_index: "${intake.artifacts.design_index}"
    outputs:
      artifacts:
        mockups: analysis/design-context
        index: analysis/design-context/INDEX.md

  mockup-approval:
    type: gate
    needs: [ui-mockups]
    when: "${gap-analysis.values.mockups_needed}"
    ask: "UI mockups complete. Continue to specification?"
    options:
      continue-to-specification: continue
      revise-mockups: {effect: revise, reruns: ui-mockups}
      stop-development: stop

  specification:
    uses: direct:specification
    needs: [mockup-approval]
    with:
      task_description: "${inputs.task_description}"
      analysis: "${codebase-analysis.artifacts.analysis}"
      gap: "${gap-analysis.artifacts.gap}"
      scope: "${gap-analysis.artifacts.scope}"
      design_index: "${ui-mockups.artifacts.index}"
      architecture: "${intake.artifacts.architecture_context}"
      risk_level: "${gap-analysis.values.risk_level}"
      audit_flag: "${inputs.audit}"
    outputs:
      artifacts:
        requirements: analysis/requirements.md
        spec: implementation/spec.md
        technical_clarifications: analysis/technical-clarifications.md

  specification-approval:
    type: gate
    needs: [specification]
    ask: "Specification complete. Continue?"
    options:
      continue-to-spec-audit: {effect: continue, sets: {spec_audit_enabled: true}}
      continue-to-planning: {effect: continue, sets: {spec_audit_enabled: false}}
      revise-specification: {effect: revise, reruns: specification}
      stop-development: stop

  spec-audit:
    uses: agent:spec-auditor
    needs: [specification-approval]
    when: "${specification-approval.values.spec_audit_enabled}"
    with:
      spec: "${specification.artifacts.spec}"
      requirements: "${specification.artifacts.requirements}"
      gap: "${gap-analysis.artifacts.gap}"
    outputs:
      artifacts:
        audit: verification/spec-audit.md

  spec-audit-approval:
    type: gate
    needs: [spec-audit]
    when: "${specification-approval.values.spec_audit_enabled}"
    ask: "Specification audit complete. Continue to implementation planning?"
    options:
      continue-to-planning: continue
      revise-specification: {effect: revise, reruns: specification}
      stop-development: stop

  planning:
    uses: agent:implementation-planner
    needs: [spec-audit-approval]
    with:
      task_description: "${inputs.task_description}"
      spec: "${specification.artifacts.spec}"
      audit: "${spec-audit.artifacts.audit}"
      design_index: "${ui-mockups.artifacts.index}"
      architecture: "${intake.artifacts.architecture_context}"
    outputs:
      artifacts:
        plan: implementation/implementation-plan.md
        visual_coverage: implementation/visual-coverage.md

  planning-approval:
    type: gate
    needs: [planning]
    when: "!${inputs.publish}"
    ask: "Implementation plan complete. Continue to implementation?"
    options:
      continue-to-implementation: continue
      revise-plan: {effect: revise, reruns: planning}
      stop-development: stop

  planning-approval-publish:
    type: gate
    needs: [planning-approval]
    when: "${inputs.publish}"
    ask: "Implementation plan complete. Continue to implementation, then push the branch and open a pull request?"
    options:
      continue-to-implementation: {effect: continue, grants: [push, pr-create]}
      revise-plan: {effect: revise, reruns: planning}
      stop-development: stop

  implementation:
    uses: skill:implementation-plan-executor
    needs: [planning-approval-publish]
    with:
      plan: "${planning.artifacts.plan}"
      spec: "${specification.artifacts.spec}"
      visual_coverage: "${planning.artifacts.visual_coverage}"
      sequential: "${inputs.sequential}"
    outputs:
      artifacts:
        work_log: implementation/work-log.md

  implementation-approval:
    type: gate
    needs: [implementation]
    ask: "Implementation complete. Continue?"
    options:
      continue-past-implementation: continue
      stop-development: stop

  tdd-green:
    uses: direct:tdd-green
    needs: [implementation-approval]
    when: "${gap-analysis.values.has_reproducible_defect}"
    with:
      red_gate: "${tdd-red.artifacts.red_gate}"
      work_log: "${implementation.artifacts.work_log}"
    outputs:
      artifacts:
        green_gate: implementation/tdd-green-gate.md

  verification-options:
    uses: direct:verification-options
    needs: [tdd-green]
    with:
      gap: "${gap-analysis.artifacts.gap}"
      user_docs_flag: "${inputs.user_docs}"
    outputs:
      values:
        # Named for what it enables rather than for the flag that seeds it.
        user_docs_enabled: bool

  verification:
    uses: skill:implementation-verifier
    needs: [verification-options]
    with:
      spec: "${specification.artifacts.spec}"
      plan: "${planning.artifacts.plan}"
      work_log: "${implementation.artifacts.work_log}"
      # Read when this node writes its closing summary, to say which continue
      # of `verification-approval` it recommends; not the verifier's input.
      browser_tests_flag: "${inputs.browser_tests}"
    outputs:
      artifacts:
        report: verification/implementation-verification.md

  verification-approval:
    type: gate
    needs: [verification]
    ask: "Verification complete. Continue?"
    options:
      # The gate value is named for what it enables: a guard reference ends in
      # lowercase letters and underscores, so it can carry no digit, and the
      # state option `e2e_enabled` is the gap analysis's seed, not this value.
      continue-to-browser-checks: {effect: continue, sets: {browser_tests_enabled: true}}
      continue-past-verification: {effect: continue, sets: {browser_tests_enabled: false}}
      stop-development: stop

  e2e-verification:
    uses: agent:e2e-test-verifier
    needs: [verification-approval]
    when: "${verification-approval.values.browser_tests_enabled}"
    with:
      spec: "${specification.artifacts.spec}"
      report: "${verification.artifacts.report}"
      design_context: "${ui-mockups.artifacts.mockups}"
    outputs:
      artifacts:
        e2e: verification/e2e-verification-report.md
        fidelity: verification/visual-fidelity.md

  e2e-approval:
    type: gate
    needs: [e2e-verification]
    when: "${verification-approval.values.browser_tests_enabled}"
    ask: "E2E verification complete. Continue?"
    options:
      continue-past-e2e: continue
      stop-development: stop

  user-docs:
    uses: agent:user-docs-generator
    needs: [e2e-approval]
    when: "${verification-options.values.user_docs_enabled}"
    with:
      spec: "${specification.artifacts.spec}"
      e2e: "${e2e-verification.artifacts.e2e}"
    outputs:
      artifacts:
        guide: documentation/user-guide.md

  docs-approval:
    type: gate
    needs: [user-docs]
    when: "${verification-options.values.user_docs_enabled}"
    ask: "Documentation complete. Continue to finalization?"
    options:
      continue-to-finalization: continue
      stop-development: stop

  # Nothing invokes this workflow as a sub-run: every reference to it in the
  # tree hands an operator a next step rather than executing one. So there is
  # no embedded input, and this node carries no guard.
  finalization:
    uses: direct:finalization
    needs: [docs-approval]
    with:
      task_description: "${inputs.task_description}"
      report: "${verification.artifacts.report}"
      work_log: "${implementation.artifacts.work_log}"
