# The change workflow, as a graph.
#
# One bounded change, proved and closed out. Four nodes named for what they do
# and one for what it approves, in a single linear chain. Nothing branches, so
# no node carries a `when` guard: a change run reads the project's standards,
# makes the change with its test, verifies it, asks once whether that stands,
# and closes out.
#
# No node carries `on:`. Under the default, a `needs` entry is satisfied by a
# completed or a skipped predecessor but never by a stopped one, which is what
# makes the gate's stop option actually end the run: `close-out` is never ready
# after a stop, and it is the only thing left.
#
# This definition is chain-only. It has no orchestrator skill and no slash
# command, and therefore no `SKILL.md` twin for a parity checklist to hold it in
# step with: it is reached as `workflow:change` from a chain node that carries a
# `dir:`, and nowhere else. That is why `statement` is the required input — it is
# the one thing the dispatch envelope carries as free text, and the worker's seed
# hands it over as the statement of the work for this definition to bind.
#
# `fix.yml` is this definition's sibling: the same spine with the reproduce-first
# discipline added. The two differ only where the discipline differs, and the
# prose sections they share are held equal by the suite rather than by intent.
#
# Target names are bare on purpose. Resolution is rooted at the plugin root and
# the provider prefix is applied at invocation, so this one file is correct
# under every generated variant without a rewrite.
#
# The node prose lives beside this file in `change.md`, one section per node id.
# Every `direct:` node is executed from its section there.
name: change
version: 1
inputs:
  statement: {type: string, required: true}
  # A documentation index a caller already knows about, so a run that was
  # dispatched from a member whose index is not at the conventional path can
  # skip discovery instead of guessing. Absent means discover.
  docs_index: {type: path, required: false}
nodes:
  standards-discovery:
    uses: direct:standards-discovery
    needs: []
    with:
      docs_index: "${inputs.docs_index}"

  change:
    uses: direct:change
    needs: [standards-discovery]
    with:
      statement: "${inputs.statement}"
    outputs:
      artifacts:
        work_log: implementation/work-log.md

  verify:
    uses: direct:verify
    needs: [change]
    with:
      work_log: "${change.artifacts.work_log}"
    outputs:
      artifacts:
        report: verification/verification-report.md

  change-approval:
    type: gate
    needs: [verify]
    ask: "Change verified. Continue to close-out?"
    options:
      continue-to-closeout: continue
      stop-before-closeout: stop

  close-out:
    uses: direct:close-out
    needs: [change-approval]
    with:
      work_log: "${change.artifacts.work_log}"
      report: "${verify.artifacts.report}"
    outputs:
      # An enum rather than a bare `string`: a declared `string` is undecidable
      # to the static check and warns, and a shipped definition resolves with
      # exactly zero warnings.
      values:
        change_outcome: {enum: [closed-out, stopped-before-closeout]}
