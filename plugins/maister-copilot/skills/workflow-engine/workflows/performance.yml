# The performance workflow, as a graph.
#
# Ten nodes named for what they do and six named for what they approve, in one
# linear chain. Gates serialize the run, so a wider fan-in would buy nothing.
#
# There is no `when` anywhere in this file, and that is the whole shape of it.
# Every phase of this workflow runs on every run: the specification audit has no
# opt-in and no size threshold, and the one optional input the workflow takes —
# profiling data — changes what a node reads rather than whether a node runs. So
# no stretch is conditional, no gate repeats a guard, and no skip can cascade,
# because nothing is ever skipped.
#
# No node carries `on:`. Under the default, a `needs` entry is satisfied by a
# completed or a skipped predecessor but never by a stopped one, which is what
# makes each gate's stop option actually end the run: nothing after it is ever
# ready.
#
# The one way back is a revise option. The gates that close the bottleneck
# analysis, the specification (at its own approval and after its audit) and the
# plan can send the run back to re-run that node with the operator's note.
# Verification keeps its in-node fix loop instead.
#
# Target names are bare on purpose. Resolution is rooted at the plugin root and
# the provider prefix is applied at invocation, so this one file is correct
# under every generated variant without a rewrite.
#
# The node prose lives beside this file in `performance.md`, one section per node
# id. Every `direct:` node is executed from its section there, and the operator
# questions asked inside nodes appear only in that prose — a reader of the graph
# alone cannot see them, and neither can the generated diagram. Their defaults,
# the recovery budgets and the phase summary keys sit in the `brief:` block below.
name: performance
version: 1
description: "Finds and fixes performance problems by static analysis of the code — N+1 queries, missing indexes, quadratic algorithms, blocking I/O, memory leaks — informed by profiling data when the operator supplies it, then specifies, plans, implements and verifies the optimisation. Use it when the task is to make something faster or leaner rather than to change what it does."
inputs:
  task_description: {type: string, required: true}
  sequential: {type: bool, required: false, default: false}

# What the dashboard draws beside each node. Definition data rather than graph
# data: the block sits outside `nodes:` and outside the hashed envelope, so
# adding or correcting a hint moves no `graph_hash` and drifts no frozen chain.
# The seven values are the closed set the viewer knows — `analysis`, `spec`,
# `plan`, `code`, `verify`, `docs`, `done` — and a writer picks the closest
# member rather than inventing one; anything else fails validation. Each gate
# carries the icon of the node it closes, so a phase and the approval that
# closes it read as one pair.
display:
  icons:
    intake:                        analysis
    codebase-analysis:             analysis
    bottleneck-analysis:           analysis
    bottleneck-approval:           analysis
    specification:                 spec
    specification-approval:        spec
    spec-audit:                    verify
    spec-audit-approval:           verify
    planning:                      plan
    planning-approval:             plan
    implementation:                code
    implementation-approval:       code
    verification-options:          verify
    verification:                  verify
    verification-approval:         verify
    finalization:                  done
  titles:
    intake:                        "Intake"
    codebase-analysis:             "Codebase analysis"
    bottleneck-analysis:           "Bottleneck analysis"
    bottleneck-approval:           "Approve bottleneck analysis"
    specification:                 "Specification"
    specification-approval:        "Approve specification"
    spec-audit:                    "Specification audit"
    spec-audit-approval:           "Approve specification audit"
    planning:                      "Implementation planning"
    planning-approval:             "Approve implementation plan"
    implementation:                "Implementation"
    implementation-approval:       "Approve implementation"
    verification-options:          "Choosing the checks"
    verification:                  "Verification"
    verification-approval:         "Approve verification"
    finalization:                  "Finalization"
  option_labels:
    bottleneck-approval:
      continue-to-specification: "Continue to the specification"
      revise-analysis: "Revise the bottleneck analysis"
      stop-performance: "Stop here"
    specification-approval:
      continue-to-spec-audit: "Continue to the specification audit"
      revise-specification: "Revise the specification"
      stop-performance: "Stop here"
    spec-audit-approval:
      continue-to-planning: "Continue to implementation planning"
      revise-specification: "Revise the specification"
      stop-performance: "Stop here"
    planning-approval:
      continue-to-implementation: "Continue to the implementation"
      revise-plan: "Revise the plan"
      stop-performance: "Stop here"
    implementation-approval:
      continue-to-verification-options: "Continue to choosing the checks"
      stop-performance: "Stop here"
    verification-approval:
      continue-to-finalization: "Continue to finalization"
      stop-performance: "Stop here"
  headers:
    bottleneck-approval:            "Bottlenecks"
    specification-approval:         "Spec"
    spec-audit-approval:            "Spec audit"
    planning-approval:              "Plan"
    implementation-approval:        "Implemented"
    verification-approval:          "Verification"

# The markdown artifacts that owe an HTML companion beside them, per node.
# Read beside the graph, not part of it: the block moves no graph hash.
html_companions:
  specification: [spec]
  planning: [plan]
  verification: [report]

# What each step's brief prints beside its prose: the phase keys its summary is
# mirrored under, its recovery budget (a prose rule, never enforced) and the
# default each in-node question takes when nobody can be asked — a short form
# of the prose's Without line, changed together with it. Outside the recorded
# identity, like the two blocks above.
brief:
  codebase-analysis:
    summary_keys: [codebase_analysis]
    budget: 2
    questions:
      clarifications: "None asked; the analysis's answers stand, and what it could not settle is recorded as unsettled."
      profiling-data: "No profiling data: the run proceeds on static analysis alone, never waiting for files."
  bottleneck-analysis:
    summary_keys: [bottleneck_analysis]
    budget: 2
  specification:
    summary_keys: [specification]
    budget: 2
    questions:
      optimization-priorities: "Every P0 and P1, the recommended constraints bundle, no numeric target beyond the invocation's."
  spec-audit:
    questions:
      spec-audit-findings: "Nothing asked: an unclassed finding stays an open risk; a classed one takes its classing outcome."
  planning:
    budget: 2
  implementation:
    summary_keys: [implementation]
    budget: 5
  verification-options:
    questions:
      standard-verifications: "Code review only, production readiness off; the reality check and pragmatic review still run."
  verification:
    budget: 3
    questions:
      verification-findings: "Nothing asked: an unclassed issue stays an open risk; a classed one takes its classing outcome."
      verification-fix-loop: "Fix and re-check unasked, two re-checks; decisions and risky fixes stay open risks; the stop takes Continue as is."

nodes:
  intake:
    uses: direct:intake
    needs: []
    with:
      task_description: "${inputs.task_description}"
    outputs:
      artifacts:
        # A directory, always created, and its emptiness is the answer to the
        # profiling-data question rather than a missing artifact.
        profiling_data: analysis/user-profiling-data

  codebase-analysis:
    uses: skill:codebase-analyzer
    needs: [intake]
    with:
      task_description: "${inputs.task_description}"
      task_type: enhancement
    outputs:
      artifacts:
        analysis: analysis/codebase-analysis.md
        clarifications: analysis/clarifications.md

  bottleneck-analysis:
    uses: agent:bottleneck-analyzer
    needs: [codebase-analysis]
    with:
      task_description: "${inputs.task_description}"
      analysis: "${codebase-analysis.artifacts.analysis}"
      profiling_data: "${intake.artifacts.profiling_data}"
    outputs:
      artifacts:
        performance_analysis: analysis/performance-analysis.md

  bottleneck-approval:
    type: gate
    needs: [bottleneck-analysis]
    ask: "Performance analysis complete. Continue to specification?"
    options:
      continue-to-specification: continue
      revise-analysis: {effect: revise, reruns: bottleneck-analysis}
      stop-performance: stop

  specification:
    uses: direct:specification
    needs: [bottleneck-approval]
    with:
      task_description: "${inputs.task_description}"
      analysis: "${codebase-analysis.artifacts.analysis}"
      performance_analysis: "${bottleneck-analysis.artifacts.performance_analysis}"
    outputs:
      artifacts:
        requirements: analysis/requirements.md
        spec: implementation/spec.md

  specification-approval:
    type: gate
    needs: [specification]
    ask: "Specification complete. Continue to specification audit?"
    options:
      continue-to-spec-audit: continue
      revise-specification: {effect: revise, reruns: specification}
      stop-performance: stop

  spec-audit:
    uses: agent:spec-auditor
    needs: [specification-approval]
    with:
      spec: "${specification.artifacts.spec}"
      requirements: "${specification.artifacts.requirements}"
      performance_analysis: "${bottleneck-analysis.artifacts.performance_analysis}"
    outputs:
      artifacts:
        audit: verification/spec-audit.md

  spec-audit-approval:
    type: gate
    needs: [spec-audit]
    ask: "Specification audit complete. Continue to implementation planning?"
    options:
      continue-to-planning: continue
      revise-specification: {effect: revise, reruns: specification}
      stop-performance: stop

  planning:
    uses: agent:implementation-planner
    needs: [spec-audit-approval]
    with:
      task_description: "${inputs.task_description}"
      spec: "${specification.artifacts.spec}"
      audit: "${spec-audit.artifacts.audit}"
      performance_analysis: "${bottleneck-analysis.artifacts.performance_analysis}"
    outputs:
      artifacts:
        plan: implementation/implementation-plan.md

  planning-approval:
    type: gate
    needs: [planning]
    ask: "Implementation plan complete. Continue to implementation?"
    options:
      continue-to-implementation: continue
      revise-plan: {effect: revise, reruns: planning}
      stop-performance: stop

  implementation:
    uses: skill:implementation-plan-executor
    needs: [planning-approval]
    with:
      plan: "${planning.artifacts.plan}"
      spec: "${specification.artifacts.spec}"
      sequential: "${inputs.sequential}"
    outputs:
      artifacts:
        work_log: implementation/work-log.md

  implementation-approval:
    type: gate
    needs: [implementation]
    ask: "Implementation complete. Continue to verification options?"
    options:
      continue-to-verification-options: continue
      stop-performance: stop

  verification-options:
    uses: direct:verification-options
    needs: [implementation-approval]
    with:
      spec: "${specification.artifacts.spec}"

  verification:
    uses: skill:implementation-verifier
    needs: [verification-options]
    with:
      spec: "${specification.artifacts.spec}"
      plan: "${planning.artifacts.plan}"
      work_log: "${implementation.artifacts.work_log}"
    outputs:
      artifacts:
        report: verification/implementation-verification.md

  verification-approval:
    type: gate
    needs: [verification]
    ask: "Verification complete. Continue to finalization?"
    options:
      continue-to-finalization: continue
      stop-performance: stop

  # Nothing invokes this workflow as a sub-run: every reference to it in the
  # tree hands an operator a next step rather than executing one. So there is
  # no embedded input, and this node carries no guard.
  finalization:
    uses: direct:finalization
    needs: [verification-approval]
    with:
      task_description: "${inputs.task_description}"
      performance_analysis: "${bottleneck-analysis.artifacts.performance_analysis}"
      report: "${verification.artifacts.report}"
      work_log: "${implementation.artifacts.work_log}"
