<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    body > header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }
    body > header h1 { margin: 0; font-size: 1.1rem; font-weight: 600; }

    /* Screen navigation */
    .screen-nav {
      background: #fafafa;
      border-bottom: 1px solid #e0e0e0;
      padding: 0.5rem 1.5rem;
    }
    .nav-screens {
      display: flex;
      gap: 0.25rem;
      flex-wrap: wrap;
      margin-bottom: 0.25rem;
    }
    .nav-screen {
      padding: 0.3rem 0.7rem;
      border-radius: 4px;
      text-decoration: none;
      color: #555;
      font-size: 0.8rem;
      background: #eee;
      transition: background 0.15s;
    }
    .nav-screen:hover { background: #ddd; }
    .nav-screen.active { background: #333; color: #fff; }

    /* Mockup content: the viewer's container only, never a screen's own <main> */
    #mockup-container {
      max-width: 1200px;
      margin: 1.5rem auto;
      padding: 1.5rem;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      min-height: 300px;
      position: relative;
    }
    .annotation-tooltip {
      position: absolute;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 3px;
      pointer-events: none;
      max-width: 250px;
      z-index: 1000;
      line-height: 1.3;
    }
    .annotation-tooltip::before {
      content: '';
      position: absolute;
      top: -4px;
      left: 10px;
      width: 8px;
      height: 8px;
      background: rgba(0, 0, 0, 0.75);
      transform: rotate(45deg);
    }

    /* Interactive screen-to-screen navigation */
    [data-screen] { cursor: pointer; }
    [data-screen]:hover { outline: 2px solid #0066cc; outline-offset: 2px; border-radius: 2px; }

    /* Annotation toggle */
    .annotations-hidden .annotation-tooltip { display: none; }
    #annotation-toggle {
      font-size: 0.8rem;
      padding: 0.25rem 0.6rem;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #f0f0f0;
      cursor: pointer;
      margin-left: 0.75rem;
    }
    #annotation-toggle:hover { background: #e0e0e0; }
    #annotation-toggle.active { background: #333; color: #fff; border-color: #333; }
  </style>
</head>
<body>
  <header>
    <h1>{{TITLE}}</h1>
    <div>
      <button id="annotation-toggle" class="active" title="Toggle annotation tooltips">Annotations</button>
    </div>
  </header>

  {{NAV}}

  <main id="mockup-container">{{CONTENT}}</main>

  <script>
    // Annotation overlay rendering
    const annotations = {{ANNOTATIONS}};
    function renderAnnotations() {
      const container = document.getElementById('mockup-container');
      annotations.forEach(function(ann) {
        if (!ann.selector) return;
        const target = container.querySelector(ann.selector);
        if (!target) return;
        const text = ann.note || ann.text || '';
        if (!text) return;
        const rect = target.getBoundingClientRect();
        const containerRect = container.getBoundingClientRect();
        const tooltip = document.createElement('div');
        tooltip.className = 'annotation-tooltip';
        tooltip.textContent = text;
        tooltip.style.top = (rect.bottom - containerRect.top + 6) + 'px';
        tooltip.style.left = (rect.left - containerRect.left) + 'px';
        container.appendChild(tooltip);
      });
    }
    if (annotations.length > 0) requestAnimationFrame(renderAnnotations);

    // Annotation toggle, remembered where the browser allows it
    var toggleBtn = document.getElementById('annotation-toggle');
    var container = document.getElementById('mockup-container');
    // Storage may be unavailable for a page opened from disk; the toggle then lasts for the page only.
    var annotationsVisible = true;
    try { annotationsVisible = localStorage.getItem('annotations-visible') !== 'false'; } catch (e) {}
    function updateToggle() {
      if (annotationsVisible) {
        container.classList.remove('annotations-hidden');
        toggleBtn.classList.add('active');
      } else {
        container.classList.add('annotations-hidden');
        toggleBtn.classList.remove('active');
      }
    }
    updateToggle();
    toggleBtn.addEventListener('click', function() {
      annotationsVisible = !annotationsVisible;
      try { localStorage.setItem('annotations-visible', annotationsVisible); } catch (e) {}
      updateToggle();
    });

    // Screen-to-screen navigation: an element with data-screen="<slug>" opens the sibling page,
    // so a page resolves the same in its version folder and in the flat copy beside it.
    document.getElementById('mockup-container').addEventListener('click', function(e) {
      var target = e.target.closest('[data-screen]');
      if (!target) return;
      var slug = target.getAttribute('data-screen');
      if (!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(slug)) return;
      e.preventDefault();
      window.location.href = slug + '.html';
    });
  </script>
</body>
</html>
