<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    body > header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }
    body > header h1 { margin: 0; font-size: 1.1rem; font-weight: 600; }

    /* Screen navigation */
    .screen-nav {
      background: #fafafa;
      border-bottom: 1px solid #e0e0e0;
      padding: 0.5rem 1.5rem;
    }
    .nav-screens {
      display: flex;
      gap: 0.25rem;
      flex-wrap: wrap;
      margin-bottom: 0.25rem;
    }
    .nav-screen {
      padding: 0.3rem 0.7rem;
      border-radius: 4px;
      text-decoration: none;
      color: #555;
      font-size: 0.8rem;
      background: #eee;
      transition: background 0.15s;
    }
    .nav-screen:hover { background: #ddd; }
    .nav-screen.active { background: #333; color: #fff; }

    /* Mockup content: the viewer's container only, never a screen's own <main>.
       It draws nothing around a screen, so the screen fills the page at the app's own width and background.
       Each value is stated because the container is a <main> too: a screen's own main rule would else reach it. */
    #mockup-container {
      display: block;
      width: auto;
      max-width: none;
      margin: 0;
      padding: 0;
      background: none;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      min-height: 300px;
      position: relative;
    }
    /* A bare fragment has no frame of its own: only it keeps off the page's edge. */
    #mockup-content:not(:has(header, main)) { padding: 1.5rem; }
    .annotation-tooltip {
      position: absolute;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 3px;
      pointer-events: none;
      max-width: 250px;
      z-index: 1000;
      line-height: 1.3;
    }
    /* The arrow points at the target from the side the note was placed on. */
    .annotation-tooltip::before {
      content: '';
      position: absolute;
      left: var(--arrow, 10px);
      width: 8px;
      height: 8px;
      background: rgba(0, 0, 0, 0.75);
      transform: rotate(45deg);
    }
    .annotation-tooltip[data-side="below"]::before { top: -4px; }
    .annotation-tooltip[data-side="above"]::before { bottom: -4px; }
    .annotation-tooltip[data-side="right"]::before { left: -4px; top: 8px; }
    .annotation-tooltip[data-side="left"]::before { left: auto; right: -4px; top: 8px; }

    /* Interactive screen-to-screen navigation */
    [data-screen] { cursor: pointer; }
    [data-screen]:hover { outline: 2px solid #0066cc; outline-offset: 2px; border-radius: 2px; }

    /* Annotation toggle */
    .annotations-hidden .annotation-tooltip { display: none; }
    #annotation-toggle {
      font-size: 0.8rem;
      padding: 0.25rem 0.6rem;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #f0f0f0;
      cursor: pointer;
      margin-left: 0.75rem;
    }
    #annotation-toggle:hover { background: #e0e0e0; }
    #annotation-toggle.active { background: #333; color: #fff; border-color: #333; }
  </style>
</head>
<body>
  <header>
    <h1>{{TITLE}}</h1>
    <div>
      <button id="annotation-toggle" class="active" title="Toggle annotation tooltips">Annotations</button>
    </div>
  </header>

  {{NAV}}

  <main id="mockup-container">{{CONTENT}}</main>

  <script>
    // Annotation notes. Each note is placed clear of what it describes, so the target stays in view:
    // above it when there is room under the viewer's own bars, else beside it, else below it, and
    // always inside the page's width. The layout can still move after the first frame (fonts,
    // images, the app's own sticky bars), so the notes are placed again on load and on resize.
    const annotations = {{ANNOTATIONS}};
    // target: the element's box in page coordinates; tip: the note's size;
    // view: the page width and the top of the container, the highest a note may sit.
    function placeTooltip(target, tip, view) {
      var GAP = 8, EDGE = 8;
      var clampLeft = function(left) { return Math.max(EDGE, Math.min(left, view.width - EDGE - tip.width)); };
      if (target.top - GAP - tip.height >= view.top) {
        return { side: 'above', top: target.top - GAP - tip.height, left: clampLeft(target.left) };
      }
      if (target.right + GAP + tip.width <= view.width - EDGE) {
        return { side: 'right', top: Math.max(view.top, target.top), left: target.right + GAP };
      }
      if (target.left - GAP - tip.width >= EDGE) {
        return { side: 'left', top: Math.max(view.top, target.top), left: target.left - GAP - tip.width };
      }
      return { side: 'below', top: target.bottom + GAP, left: clampLeft(target.left) };
    }
    var placed = [];
    function placeAnnotations() {
      var container = document.getElementById('mockup-container');
      var box = container.getBoundingClientRect();
      var scrollX = window.scrollX, scrollY = window.scrollY;
      var view = { top: box.top + scrollY, width: document.documentElement.clientWidth };
      placed.forEach(function(entry) {
        // Measured from the container's corner: where it stood before, near an edge, it would wrap narrower.
        entry.tooltip.style.top = '0px';
        entry.tooltip.style.left = '0px';
        var rect = entry.target.getBoundingClientRect();
        var target = { top: rect.top + scrollY, left: rect.left + scrollX, right: rect.right + scrollX, bottom: rect.bottom + scrollY };
        var at = placeTooltip(target, { width: entry.tooltip.offsetWidth, height: entry.tooltip.offsetHeight }, view);
        entry.tooltip.setAttribute('data-side', at.side);
        entry.tooltip.style.top = (at.top - (box.top + scrollY)) + 'px';
        entry.tooltip.style.left = (at.left - (box.left + scrollX)) + 'px';
        var arrow = Math.max(6, Math.min(target.left + Math.min(16, rect.width / 2) - at.left, entry.tooltip.offsetWidth - 14));
        if (at.side === 'above' || at.side === 'below') entry.tooltip.style.setProperty('--arrow', arrow + 'px');
        else entry.tooltip.style.removeProperty('--arrow');
      });
    }
    function renderAnnotations() {
      const container = document.getElementById('mockup-container');
      annotations.forEach(function(ann) {
        if (!ann.selector) return;
        const target = container.querySelector(ann.selector);
        if (!target) return;
        const text = ann.note || ann.text || '';
        if (!text) return;
        const tooltip = document.createElement('div');
        tooltip.className = 'annotation-tooltip';
        tooltip.textContent = text;
        container.appendChild(tooltip);
        placed.push({ target: target, tooltip: tooltip });
      });
      placeAnnotations();
    }
    if (annotations.length > 0) {
      requestAnimationFrame(renderAnnotations);
      window.addEventListener('load', placeAnnotations);
      window.addEventListener('resize', placeAnnotations);
    }

    // Annotation toggle, remembered where the browser allows it
    var toggleBtn = document.getElementById('annotation-toggle');
    var container = document.getElementById('mockup-container');
    // Storage may be unavailable for a page opened from disk; the toggle then lasts for the page only.
    var annotationsVisible = true;
    try { annotationsVisible = localStorage.getItem('annotations-visible') !== 'false'; } catch (e) {}
    function updateToggle() {
      if (annotationsVisible) {
        container.classList.remove('annotations-hidden');
        toggleBtn.classList.add('active');
        // A hidden note has no size, so the notes are placed again once shown.
        placeAnnotations();
      } else {
        container.classList.add('annotations-hidden');
        toggleBtn.classList.remove('active');
      }
    }
    updateToggle();
    toggleBtn.addEventListener('click', function() {
      annotationsVisible = !annotationsVisible;
      try { localStorage.setItem('annotations-visible', annotationsVisible); } catch (e) {}
      updateToggle();
    });

    // Screen-to-screen navigation: an element with data-screen="<slug>" opens the sibling page,
    // so a page resolves the same in its version folder and in the flat copy beside it.
    document.getElementById('mockup-container').addEventListener('click', function(e) {
      var target = e.target.closest('[data-screen]');
      if (!target) return;
      var slug = target.getAttribute('data-screen');
      if (!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(slug)) return;
      e.preventDefault();
      window.location.href = slug + '.html';
    });
  </script>
</body>
</html>
