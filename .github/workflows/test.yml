name: Test
# Pushes run CI only on the long-lived branches and release branches; other
# branches are checked through their pull request.
on:
  push:
    branches: [master, beta, 'release/**']
  pull_request:

# A newer push to the same branch or pull request supersedes the run before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The floor package.json declares, so a verb reaching for a newer API
      # fails here rather than in a consumer's session.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and validate Copilot CLI variant
        run: make build && make validate

      # The build writes plugins/maister/interface.json, which is committed.
      # `git diff` alone sees modified tracked files only; a newly written file
      # would be untracked and pass silently. `git status --porcelain` covers
      # both.
      - name: Check the build left the tree clean
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "::error::make build or make validate changed the tree — run make build and commit the result"
            printf '%s\n' "$status"
            exit 1
          fi

      - name: Test the engine verbs
        run: make test

      - name: Run the engine and the hooks through bash
        run: make smoke

      # Notifies a downstream repository's CI of each push to master or beta,
      # so a release reaches it once, when it is promoted. Off unless the
      # repository sets both the PRO_DISPATCH_REPO variable (owner/name) and the
      # PRO_DISPATCH_TOKEN secret, so forks and clones skip it; one without the
      # other warns and exits clean, and a rejected dispatch fails the step.
      # Every value is routed through env: and referenced as a quoted shell
      # variable, never interpolated into the run: body.
      - name: Notify downstream CI
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/beta')
        env:
          PRO_DISPATCH_TOKEN: ${{ secrets.PRO_DISPATCH_TOKEN }}
          PRO_DISPATCH_REPO: ${{ vars.PRO_DISPATCH_REPO }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$PRO_DISPATCH_TOKEN" ] && [ -z "$PRO_DISPATCH_REPO" ]; then
            echo "downstream dispatch is not configured for this repository; skipping"
            exit 0
          fi
          if [ -z "$PRO_DISPATCH_REPO" ]; then
            echo "::warning::PRO_DISPATCH_TOKEN is set but the PRO_DISPATCH_REPO variable is not; skipping the downstream dispatch"
            exit 0
          fi
          if [ -z "$PRO_DISPATCH_TOKEN" ]; then
            echo "::warning::PRO_DISPATCH_REPO is set but the PRO_DISPATCH_TOKEN secret is not; skipping the downstream dispatch"
            exit 0
          fi
          payload="$(jq -n --arg sha "$SHA" --arg ref "$REF" --arg repo "$REPO" \
            '{event_type: "open-push", client_payload: {sha: $sha, ref: $ref, repo: $repo}}')"
          http_code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST \
            -H "Authorization: token $PRO_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$PRO_DISPATCH_REPO/dispatches" \
            -d "$payload")"
          echo "dispatch response: $http_code"
          case "$http_code" in
            2??) ;;
            *)
              echo "::error::downstream dispatch returned HTTP $http_code"
              exit 1
              ;;
          esac

  # The engine and the hooks on Windows: the verb suite, then the shell smoke
  # under each shell a host may run a command in, from paths written with `\`
  # and holding a space. The checkout keeps the runner's core.autocrlf, so every
  # file .gitattributes leaves alone arrives with CRLF, as on an operator's
  # machine. No `make` here: the runner does not ship it. Every smoke step runs
  # whatever the step before it did, so one run reports every shell.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The engine tests read a built Copilot CLI variant. The mixed `D:/…`
      # form of the path reads the same in Git Bash and in Node.
      - name: Build the Copilot CLI variant for the tests
        shell: bash
        run: |
          variant="$(cygpath -m "$RUNNER_TEMP")/copilot-variant/copilot"
          bash platforms/copilot-cli/build.sh --out "$variant"
          echo "MAISTER_TEST_VARIANT=$variant" >> "$GITHUB_ENV"

      - name: Test the engine verbs
        shell: bash
        run: node --test tests/engine/*.test.mjs

      - name: Shell smoke under PowerShell 7
        if: ${{ !cancelled() }}
        shell: pwsh
        run: node tests/shell-smoke.mjs --shell=pwsh

      - name: Shell smoke under Windows PowerShell
        if: ${{ !cancelled() }}
        shell: powershell
        run: node tests/shell-smoke.mjs --shell=powershell

      - name: Shell smoke under cmd.exe
        if: ${{ !cancelled() }}
        shell: cmd
        run: node tests/shell-smoke.mjs --shell=cmd

      - name: Shell smoke under Git Bash
        if: ${{ !cancelled() }}
        shell: bash
        run: node tests/shell-smoke.mjs --shell=bash

  # Builds the Copilot CLI variant of this push and commits it to
  # dist/beta (from beta) or dist/stable (from master), the branches the Copilot
  # marketplace file points at. Only pushes to those two branches of this
  # repository publish: never release/*, never a pull request. Its own
  # concurrency group queues publishes of one branch instead of cancelling one
  # mid-push; a superseded run cancelled by the workflow group is safe, since a
  # push is atomic and the newer run publishes.
  publish:
    needs: [test, windows]
    if: github.event_name == 'push' && github.repository == 'SkillPanel/maister' && (github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-dist-${{ github.ref_name }}
      cancel-in-progress: false
    outputs:
      result: ${{ steps.publish.outputs.result }}
      version: ${{ steps.publish.outputs.version }}
      marketplace: ${{ steps.publish.outputs.marketplace }}
    steps:
      # The whole history: the publish reads its interface baseline from it
      # and checks the source commit against the one on the dist branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish the Copilot CLI variant
        id: publish
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: bash tools/publish-dist.sh --source-branch "$SOURCE_BRANCH" --source-sha "$SOURCE_SHA"

  # Installs the published plugin the way a user does, from a clean Copilot
  # CLI with no sign-in: add this repository's marketplace at the pushed branch,
  # install maister from it, and check the installed version. The job holds no
  # credential: no permissions, no checkout, no token handed to setup-node, and
  # every copilot call runs with the token variables unset under a scratch home.
  dist-install-smoke:
    needs: publish
    if: needs.publish.outputs.result == 'committed' || needs.publish.outputs.result == 'unchanged'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          token: ''

      - name: Install maister from the marketplace with a clean Copilot CLI
        env:
          REPO: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          MARKETPLACE: ${{ needs.publish.outputs.marketplace }}
          VERSION: ${{ needs.publish.outputs.version }}
          COPILOT_VERSION: 1.0.112
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          npm install --prefix "$scratch/cli" --no-audit --no-fund "@github/copilot@$COPILOT_VERSION"
          mkdir -p "$scratch/home" "$scratch/copilot-home"
          cd "$scratch"
          isolated_copilot() {
            env -u GH_TOKEN -u GITHUB_TOKEN -u COPILOT_GITHUB_TOKEN -u GH_ENTERPRISE_TOKEN -u GITHUB_ENTERPRISE_TOKEN \
              HOME="$scratch/home" COPILOT_HOME="$scratch/copilot-home" \
              GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0 \
              "$scratch/cli/node_modules/.bin/copilot" "$@"
          }
          isolated_copilot --version
          isolated_copilot plugin marketplace add "$REPO#$SOURCE_BRANCH"
          isolated_copilot plugin install "maister@$MARKETPLACE"
          isolated_copilot plugin list --json > "$scratch/plugins.json"
          if ! node -e 'const l = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); process.exit(Array.isArray(l) && l.some((p) => p.name === "maister" && p.marketplace === process.env.MARKETPLACE && p.version === process.env.VERSION && p.enabled === true) ? 0 : 1)' "$scratch/plugins.json"; then
            echo "::error::the installed plugins hold no enabled maister $VERSION from $MARKETPLACE"
            cat "$scratch/plugins.json"
            exit 1
          fi
          echo "maister $VERSION installed from $MARKETPLACE"
