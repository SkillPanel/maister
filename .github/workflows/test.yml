name: Test
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the compatibility contracts suite
        run: make test

      - name: Build and validate Copilot CLI variant
        run: make build && make validate

      # `git diff` alone sees modified tracked files only; a newly generated
      # variant file would be untracked and pass silently. `git status
      # --porcelain` covers both.
      - name: Check generated variant is committed
        run: |
          test -z "$(git status --porcelain -- plugins/maister-copilot/)" \
            || (echo "generated variant is stale — run \`make build\` and commit" \
                && git status --porcelain -- plugins/maister-copilot/ && exit 1)
