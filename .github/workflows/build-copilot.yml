name: Build Copilot CLI Variant
on:
  push:
    branches: [master, v2]
    paths: ['plugins/maister/**', 'platforms/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `make validate` delegates its schema and hook-registration checks to
      # `scripts/verify-contracts.mjs`, which imports `ajv` and `yaml`.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Copilot CLI variant
        run: make build

      - name: Validate build
        run: make validate

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins/maister-copilot/
          git diff --cached --quiet || git commit -m "Rebuild Copilot CLI variant"
          git push
