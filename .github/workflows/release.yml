name: Release
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate
        run: make build && make validate

      # Tags from a maintenance line can be pushed after a newer major exists.
      # Only the highest stable version becomes the latest release, and release
      # notes compare against the stable tag just below this one.
      - name: Resolve latest and previous release
        id: versions
        run: |
          stable=$(git tag -l 'v*' --sort=v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          highest=$(printf '%s\n' "$stable" | tail -n 1)
          previous=$(printf '%s\n' "$stable" | awk -v t="$GITHUB_REF_NAME" '$0 == t { print p; exit } { p = $0 }')
          if [ "$GITHUB_REF_NAME" = "$highest" ]; then latest=true; else latest=false; fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      # The changelog section for this version is the release body: everything
      # under its `## X.Y.Z` heading, up to the next `## ` heading. A tag the
      # changelog has no section for gets GitHub's generated notes instead.
      - name: Read the release notes from the changelog
        id: notes
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## / { if (found) exit; if ($2 == v && NF == 2) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$notes"
          if grep -q '[^[:space:]]' "$notes"; then
            echo "body_path=$notes" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.body_path == '' }}
          make_latest: ${{ steps.versions.outputs.latest }}
          previous_tag: ${{ steps.versions.outputs.previous }}
