task:
  key: ACME-1001
  title: '[INV] My progress: backend support for employee progress summary'
  description: >-
    Investigation: can the backend serve the four "My progress" metrics for the
    current employee, all-time, in a single call?
    (1) Count of completed activities.
    (2) Count of achieved certificates - is a certificate a record in Catalog Hub awarded on
    activity completion, or a separate manually managed entity?
    (3) Total time spent on learning - is actual time-on-activity recorded anywhere? LEDGER reports
    progress and score; does it also report session time? For video / article / workshop types, is
    there anything beyond declared duration metadata?
    (4) Is all-time scope queryable without an N+1 per activity?
    Why it matters: "My progress" tile on the new employee dashboard (ACME-1002). Metric 3 is the
    risk - if only declared duration exists, we either ship "estimated time" or drop the metric.
    Expected deliverable: yes/no verdict per metric with endpoint names where they exist; shape of
    work required for gaps; follow-up tickets created for the gaps.
    Scope boundaries: NOT in scope - manager/team-level aggregate progress; building any of it.
    Context: Northwind (WIDGET) go-live 1 October 2026.
  status: completed
  tags: [investigation, widget, dashboard, learning]
  priority: high

