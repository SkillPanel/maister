task:
  title: Stocktake report is slow and degrades as the catalogue grows
  description: >-
    The end-of-month stocktake report (npm run report) takes 3.4 seconds on 4000
    counted lines and gets slower as the catalogue grows; it used to be instant.
    Find and fix the bottlenecks.
  status: in_progress
  tags: [performance, nodejs, cli-report]
  priority: high

project_context:
  project_doc_paths: []   # no .maister/docs/INDEX.md in this project

performance_context:
  bottlenecks_identified: 6
  user_data_available: false
  bottleneck_priorities:
    p0: 1
    p1: 2
    p2: 2
    p3: 1
  phase_summaries:
    codebase_analysis:
      summary: >-
        Two independent algorithmic defects in 54 lines explain the 3.4s runtime -- a per-call
        full catalogue re-read/re-parse in catalogue.js (O(n*m) with heavy I/O) and a nested
        self-join in report.js (O(n^2)). Both fixable in place, but the test suite pins almost
        nothing, so characterisation tests must land first.
      key_files:
        - src/catalogue.js
        - src/report.js
        - src/report.test.js
        - data/catalogue.json
        - data/counts.json
        - package.json
      complexity: simple
      risk_level: medium
      decisions:
        - decision: Treat the fix as two separate, independently shippable changes -- catalogue caching/indexing and the shelf self-join
          rationale: they have different risk profiles and different observable side effects
        - decision: Pin current CLI stdout with a golden-output test before touching code
          rationale: no existing assertion covers ordering, rounding, or the pair count, so a correct-looking refactor can silently change published numbers
        - decision: Preserve the doubled ordered-pair semantics of duplicateShelves() (each unordered pair emitted twice) rather than "fixing" it
          rationale: the printed count is an observable contract, and halving it is a behaviour change disguised as an optimisation
        - decision: Keep findBySku returning null (not undefined) for misses
          rationale: a naive Map.get swap changes the documented return value for a currently dead but exported API
      risks:
        - "Unresolved data-shape discrepancy on data/catalogue.json. Agent 1 reports 4,000 rows / 24,001 lines / 370,792 bytes (from reading the file). Agent 2 reports 2,800 items / 16,801 lines (derived partly from the diffstat of commit 12f0abc, which added +16,800 lines). Direct wc by the reporter confirms 24,001 lines / 370,792 bytes; at the file's 6-lines-per-object pretty-print that arithmetic favours 4,000 rows, and 2,800 rows x 6 = 16,800 is exactly the added line count, suggesting Agent 2 measured the delta rather than the total. Recorded as unresolved rather than decided: it changes the magnitude of the multiplier m, not the shape of the bottleneck."
        - "Line count of data/counts.json also differs by one (20,001 vs 20,002); immaterial, both agents agree on 4,000 entries."
        - "if (!item) continue (report.js:13) appears never to fire on current data -- every counted SKU exists in the catalogue. The miss path is therefore untested and unexercised; it must be preserved on faith, not on evidence."
        - "Caching the parsed catalogue changes freshness semantics. load()'s doc comment (\"read from disk on every call\") reads as a deliberate statement. load() has zero in-repo consumers, so the risk is external/future callers only -- but it is exported, so treat it as public."
        - "README is stale (\"1,200 counted lines\"); the data now holds 4,000. Any timing claim quoted from the README is wrong."
        - "AskUserQuestion is unavailable in this non-interactive session; the five Phase 1 clarifying questions went unasked and are recorded as documented assumptions in analysis/clarifications.md."
      artifacts:
        - path: analysis/codebase-analysis.md
          label: Codebase Analysis
          html: null
        - path: analysis/clarifications.md
          label: Clarifications (unasked -- assumptions documented)
          html: null
    bottleneck_analysis:
      summary: >-
        Six bottlenecks across 54 lines; the P0 per-call catalogue re-read/re-parse (1.48 GB,
        16M objects per run) accounts for an estimated 75-90% of the 3.4 s, but it is a
        constant-factor fix that leaves both quadratic terms intact. Catalogue row count
        resolved at 4,000 by direct file read; all timing figures are reasoned, not measured,
        because every Bash invocation was denied by the sandbox.
      user_data_incorporated: false
      bottlenecks:
        - "P0 catalogue.js:8 - full readFileSync+JSON.parse per findBySku call, 4,000x per run (~2.5-3.1 s, 75-90%); fix by module-level cache, 4-10x total speedup"
        - "P1 report.js:23-26 - O(n^2)=16M-iteration shelf self-join (~0.15-0.35 s today, but 40-60% of residual once P0 lands); fix by shelf bucketing, 50-100x fewer iterations"
        - "P1 catalogue.js:12 - .find linear scan, 8,002,000 comparisons due to aligned SKU ordering (~2-4%); fix with SKU Map, preserving null and first-match-wins"
        - "P2 report.js:22,25 - 129,360 pair arrays materialised when only .length is read at report.js:35; not fixed by the bucketing change"
        - "P2 catalogue.js:6-9 - aliasing/freshness contract that the P0 cache introduces: all callers would share one mutable array"
        - "P3 report.js:9 + report.js:21 - counts.json read and parsed twice per run (~1-4 ms, under 0.15%, but ~1-3% of a fully optimised build)"
      decisions:
        - decision: Rank the catalogue re-parse P0 and the two asymptotic defects P1
          rationale: biggest-clock-share first, but with an explicit note that P1 must ship too or the slowdown returns with the next data growth
        - decision: "Treat the redundant counts.json parse (report.js:9 + report.js:21) as P3, not P2"
          rationale: it is real but ~0.1 % of the clock; ranking it higher would misdirect effort
        - decision: Split the duplicateShelves cost into two separate findings -- iteration count (B3, fixed by bucketing) and allocation volume (B4, not fixed by bucketing)
          rationale: bucketing alone leaves ~129 k throwaway arrays untouched
        - decision: Recommend the bucketed self-join be driven by an outer loop still in counts file order
          rationale: so the returned array is element-for-element identical, not merely the same length
      risks:
        - "Zero measurements. Bash is blanket-denied here (node -e ... and wc -l both refused). Every millisecond figure is reasoned from data shape and known V8 throughput, presented as a range. The first implementation step must record a real baseline."
        - "Pair count disagreement with Phase 1. Phase 1 quotes recount pairs: 129120. The verified shelf distribution gives 129,360. Neither is measured. Since the printed number is being treated as a contract, the golden test must capture the actual value before any rewrite -- do not hard-code either figure from these reports."
        - "Caching load() introduces aliasing. Today every caller gets a fresh array. A module-level cache hands the same array to every caller; one mutation by any consumer silently corrupts all later calls. load() is exported with zero in-repo consumers, so this is a latent external-contract hazard, not a current bug."
        - "The if (!item) continue miss path (report.js:13) is unreachable on current data -- all 4,000 counted SKUs exist in the catalogue. It must be preserved without test evidence."
        - "resolved: data/catalogue.json row count dispute -- resolved at 4,000 by direct file read (final element SKU-03999, array closes at line 24,002); the 2,800 figure was the commit delta."
      artifacts:
        - path: analysis/performance-analysis.md
          label: Performance Analysis
          html: null
    specification:
      summary: null
      decisions: []
      risks: []
      artifacts: []

