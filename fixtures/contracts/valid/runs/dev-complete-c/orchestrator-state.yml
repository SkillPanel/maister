      decisions:
        - decision: "Criticals 1-3 rejected as false positives, with the mechanism recorded in spec section T3a"
          rationale: "FriendlyIdAutoConfiguration registers FriendlyIdModule globally; FriendlyIdSafe accepts either encoding. Verified at ParentContextConfiguration.java:76/:132 and FriendlyIdSafe.java:12-20, and confirmed by the project owner."
        - decision: "Console renamed /admin/catalog to /admin/applications"
          rationale: "The Angular host enumerates admin slugs, so a type-specific slug costs a cross-repo PR per future application type; the rest of the multi-type generalization is deliberate YAGNI."
        - decision: "Requester process picker gated behind BE ask #5"
          rationale: "GET /applications/processes is manage-only, so a requester 403s; interim behaviour is single-process resolution, time-boxed to one process per company."
        - decision: "Amendment register rebuilt as CC1-CC22"
          rationale: "The A-series had contradictory and undefined entries and collided with gap-analysis A1-A9 and problem-statement A1-A5."
        - decision: "Two unused endpoints removed rather than documented (scope=company, GET handler-preview)"
          rationale: "Zero v1 consumers; scope=company additionally needs both permissions because the coarse gate runs first."
        - decision: "Standards deviation for the handler picker recorded without amending the standard"
          rationale: "Owner declined the shared-audience-picker amendment, so the spec records the deviation and the standard stands as written."
      risks:
        - "HOST BLOCKER: microAppRoute('applications', ...) must be added to BOTH EMPLOYEE_ROUTING and ADMIN_ROUTING in repo-beta. The employee entry is a functional blocker for the handler journey (the inbox CTA opens a new tab = cold URL load), so that host PR must land WITH this work, not after."
        - "Scope grew by two requirements (24 answers surface, 25 cancel) - machinery that existed with no requirement behind it; requirement 25 has no dedicated mockup."
        - "BE ask #5 (requester-readable process list) is open; until it lands, multi-process companies get an error where the design promised a picker."
        - "The FriendlyID mechanism was verified from configuration, not from a live payload; the first live-API smoke test should confirm it at the wire."
      artifacts:
        - path: verification/spec-audit.md
          label: "Spec audit + orchestrator correction (verdict revised to pass-with-concerns)"
          html: null
        - path: implementation/spec.md
          label: "Implementation specification, revision 2 (697 lines)"
          html: implementation/spec.html
    planning:
      summary: >-
        25 task groups (22 code, 1 test review, 2 non-code), 148 steps, 6 dispatch waves,
        ~96 tests. Visual coverage 18/18 screens. Group 1 (surgical acme-portal.d.ts) runs alone
        first; the WITHDRAWN sweep follows immediately; the BE-blocked process picker is
