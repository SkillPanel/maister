        - decision: "Accepted Group 14's justified breach of the no-new-i18n-keys rule"
          rationale: "No Approve/Reject imperative existed in the 180-key inventory; hardcoded English would violate a CRITICAL i18n rule that outranks the instruction. Two keys added to all 8 locales."
        - decision: "Conflict rows show a shared cause explanation rather than fabricated per-row reasons"
          rationale: "The BE conflict carries only the first offending id and one errorType for the batch; inventing a timestamp would be incorrect data presented as fact."
      risks:
        - "Group 24 (>1-process requester picker) remains deliberately unimplemented pending BE ask #5; multi-process companies get an error where the design promised a picker."
        - "The repo-beta host changeset is documented but NOT applied - /e/applications/:requestId 404s on a cold load until it lands, which is exactly the handler journey."
