        - decision: "isOwner gap resolved by a blocking BE ask, not a client-side workaround"
          rationale: "ApplicationDetailDto has no applicant identity; the own-list-cache fallback fails on cold deep-links, which is exactly how handlers and coordinators arrive."
        - decision: "BE ask to widen handler-preview's gate and accept unsaved sources[]"
          rationale: "Endpoint is applications:request-gated and persisted-sources-only, so the specced live preview is unbuildable."
        - decision: "BE ask for a repeatable status query param"
          rationale: "Composite Open/Closed chips are not expressible against a single-value param; axios already serialises arrays with arrayFormat repeat."
        - decision: "BE ask for attestedByName; omit the Batches column meanwhile"
          rationale: "Rendering raw UUIDs is forbidden and a per-row person lookup is poor value."
        - decision: "Verify the host /admin/* wildcard and ship a paired repo-beta menu-item change"
          rationale: "An unverified wildcard is a launch blocker, not a discoverability nit."
        - decision: "Promote SurveySelector to src/components/connected/surveySelect"
          rationale: "A cross-feature deep import fails the CI Sheriff gate; the second consumer proves it belongs in shared."
        - decision: "Parse ApplicationAnswerDto.value as a jsonb envelope and correct the test fixtures"
          rationale: "Value is {type,value} JSON text, not a date string; spec-literal fixtures would pass against a shape production never sends."
        - decision: "Handler picker follows the spec (TeamSelect + person multi-select); amend shared-audience-picker.md"
          rationale: "BE contract is a flat sources[], not CriteriaUnion, and the preview decision removes the shared module's main draw."
        - decision: "Generate mockups for ALL uncovered surfaces (Phase 4 runs)"
          rationale: "Batches tab, AttestDialog, edit/withdraw modals, rejected-outcome card and race banner have no screen ID."
        - decision: "Add all three safety-net specs (resolveActionTarget, ActivityCatalogView activeTab, exportHandoff)"
          rationale: "Each can fail silently with no compile error and no existing test."
        - decision: "Add 'uk' to scripts/i18n-extract.ts CONFIG.locales"
          rationale: "The extractor silently skips Ukrainian on every run; a one-line fix disarms a recurring footgun."
      risks:
        - "BLOCKING: four BE asks must land before the capability model, process-editor preview, composite chips and the Batches attestedBy column can be implemented."
        - "The repo-beta (Angular host) change lives in a second repository and is outside this task's verification gates."
        - "Amending shared-audience-picker.md is a standards change requiring /maister:standards-update, not a silent edit."
        - "ActivityCatalogView has 6 unstructured edit sites (one more than the spec counted) in a 468-line file with no tab registry."
