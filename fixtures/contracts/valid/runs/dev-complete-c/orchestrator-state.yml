        - decision: "All 7 external WIDGET edit sites in one group with the activeTab regression spec"
          rationale: "A 468-line file with no tab registry gets one owner; a mistake there regresses existing WIDGET tabs."
        - decision: "Type-only, scaffolding and translation groups declare no jest specs"
          rationale: "test-writing.md forbids route-config, key-factory and pass-through specs; their gates are typecheck/sheriff/i18n validators."
        - decision: "Blocked process picker is Group 24, labelled and unstarted"
          rationale: "Deferral stays visible rather than silently dropped."
      risks:
        - "Feature test total (~96) exceeds the 16-34 single-feature guidance, though per-group limits (2-8, review <=10) are respected."
        - "BE ask #5 OPEN - the v1 single-process create path is correct only while one enabled process exists per company."
        - "repo-beta EMPLOYEE_ROUTING entry is a functional blocker for the handler journey; landing it is outside this task's gates."
