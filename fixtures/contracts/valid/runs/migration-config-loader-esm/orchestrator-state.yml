migration_context:
  migration_type: code
  current_system:
    description: "The config loader ships as a CommonJS package. It reads three JSON files from disk at require time, caches the merged result on the module object, and every service in the repository reaches it through require."
    technologies: [node, commonjs, json]
  target_system:
    description: "The same loader as an ESM package with an explicit entry point, the JSON files read through an import attribute, and the merged config exposed as a named export rather than hung off the module object."
    technologies: [node, esm, json]
  migration_strategy:
    approach: incremental
    phases:
      - "Dual-publish the package: the ESM entry point ships beside the existing CommonJS one, so no consumer has to move on the same commit."
      - "Move the four in-repository consumers to the named import, one commit each."
      - "Drop the CommonJS entry point once no consumer resolves it."
  risk_level: medium
  breaking_changes:
    - "require() of the package no longer returns the merged config: consumers import the named export instead."
    - "The merged config is no longer cached on the module object, so a consumer that mutated it now mutates a copy."
    - "The three JSON files are read through an import attribute, which raises the package's minimum Node version."
  rollback_plan_created: true
  dual_run_configured: false
  clarifications_resolved: true
  phase_summaries:
    current_state_analysis:
      node: current-state-analysis
      summary: "The loader is one package of four files, and the only place the JSON config is read. Four in-repository consumers reach it through require, and two of them mutate the object they get back. Nothing outside the repository resolves the package."
      decisions:
        - decision: Treat the two mutating consumers as the load-bearing part of the move
          rationale: every other consumer reads the merged config and would not notice the export shape changing, while a mutation against a copy fails silently
      risks:
        - "Two consumers mutate the merged config in place. Whether anything depends on that mutation being visible elsewhere is not settled by reading alone."
      artifacts: []
    gap_analysis:
      node: gap-analysis
      summary: "Classified as a code migration. Three gaps: the entry point, the JSON reads, and the caching behaviour the two mutating consumers rely on. Incremental was recommended over big-bang because the package can dual-publish while its consumers move one at a time."
      decisions:
        - decision: Recommend incremental over big-bang
          rationale: the package can carry both entry points for the length of the run, so no consumer has to move on the commit that moves the package
        - decision: Leave dual-run unconfigured
          rationale: dual-run compares two live systems against the same traffic, and a module-system change has no traffic of its own to split
      risks:
        - "The minimum Node version moves with the import attribute. Any consumer pinned below it is out of scope here and was not surveyed."
      artifacts: []
    specification:
      node: specification
      summary: "The specification covers the three gaps and the rollback: the ESM entry point ships beside the CommonJS one, the JSON reads move to an import attribute, and the merged config becomes a named export the consumers copy from. The rollback plan is one revert of the package commit, which the dual entry point makes safe at every step."
      decisions:
        - decision: Keep the CommonJS entry point for the whole run
          rationale: a package that resolves both ways is one a consumer can move to on its own commit, and it is what makes the rollback a single revert
      risks: []
      artifacts: []
    implementation:
      node: execution
      summary: "Four task groups in order: the ESM entry point, the JSON import attributes, the four consumers, and the removal of the CommonJS entry point. The suite is green and the merged config values are unchanged."
      decisions:
        - decision: Move the two mutating consumers before the other two
          rationale: they are the only ones whose behaviour actually changes, so a red suite after them points at the mutation rather than at the import
      risks: []
      artifacts:
        - path: implementation/work-log.md
          label: Work log
          html: null

verification_context:
  last_status: passed
  issues_found: 2
  fixes_applied:
    - issue: "The ESM entry point exported the merged config by reference, so a consumer could still mutate the cached object."
      fix: "The named export returns a structured copy per import site, which is what the specification asked for."
      node: issue-resolution
    - issue: "One consumer kept its require() call behind a lazy branch the first verification pass did not reach."
      fix: "The branch now uses the named import, and an assertion covers it."
      node: issue-resolution
  decisions_made:
    - decision: Re-verify the whole suite rather than the two touched files
      rationale: the loader is imported by every service in the repository, so a regression would surface outside the files the fixes touched
  reverify_count: 1

external_research:
  performed: true
  category: module-system
  breaking_changes:
    - "Import attributes are required to read JSON from ESM, and they raise the package's minimum Node version."
    - "An ESM named export is a live binding rather than a property on a module object, so the caching behaviour of the CommonJS form does not carry over."
  migration_guide_url: https://nodejs.org/api/esm.html

