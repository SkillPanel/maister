# Overlays the brief sample: replaces a node's budget and removes its absence,
# removes a node's entry whole, adds a node with a budget of its own, and
# carries a profile that disables a node and adds a budget beside another's
# recommendation.
extends: brief.yml

brief:
  analysis:
    budget: 3
    absent: null
  review: null
  extra:
    budget: 1

add:
  extra:
    uses: skill:implementation-verifier
    needs: [review]
    before: [wrap-up]

profiles:
  lean:
    disable: [audit]
    brief:
      specification:
        budget: 4
