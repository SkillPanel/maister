          rationale: "audit I1/I3: a failure names its country and expected values stay literals"
        - decision: "FREE_DELIVERY_FROM_CENTS JSDoc wrapped to the file's multi-line style"
          rationale: the single line Group 1 wrote was ~130 characters, longer than the rest of the file; comment-only change
      risks:
        - "Release gate (audit W1): the PL increase (orders of 50.00–84.99 PLN will cost 19.90 PLN) still has no named owner for business sign-off."
        - "`goodsCents` still carries no currency; the JSDoc is the only safeguard."
