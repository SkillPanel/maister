    codebase_analysis:
      node: codebase-analysis
      summary: A free-delivery threshold already exists as one global constant (FREE_FROM_CENTS = 5000) in src/delivery-quote.ts, applied to every country whatever its currency. The task is to replace it with a per-country table in that one 39-line file and widen its tests beyond DE.
      key_files:
        - src/delivery-quote.ts
        - test/delivery-quote.test.ts
        - src/cart.ts
        - src/payment-methods.ts
      primary_language: TypeScript
      decisions:
        - decision: Add a separate module-private `Readonly<Record<Country, …>>` threshold table in `src/delivery-quote.ts`, not config-file or env infrastructure
          rationale: this matches the existing `BASE_RATES` pattern, and the compiler then forces a value for every country
        - decision: Keep thresholds out of `BASE_RATES` / `DeliveryQuote`
          rationale: "`BASE_RATES` is typed as `DeliveryQuote`, so a threshold field there would leak into the quote output"
        - decision: "Store each threshold as an integer in its country's minor currency unit (EUR/CHF/PLN)"
          rationale: required by the money rule in coding-style.md, and it fixes the current 50-PLN inconsistency
        - decision: Delete `FREE_FROM_CENTS` and extract a small predicate (e.g. `shipsFree(country, goodsCents)`)
          rationale: the standards forbid dead code and prefer extracting over branching
        - decision: Keep the `quoteDelivery(address, goodsCents)` signature unchanged
          rationale: the thresholds are internal constants, so no caller needs to change
        - decision: Leave `src/cart.ts` and `src/payment-methods.ts` unchanged
          rationale: they share no delivery configuration
      risks:
        - Threshold values for each country (DE, AT, NL, PL, CH) are not specified. The business must supply them.
        - Can a country have no free delivery at all? This decides between a `number | null` table entry and a mandatory `number`.
        - The boundary is inclusive (`>=`) and an existing test locks it. It should be confirmed as the intended rule.
        - "The currency of `goodsCents` is assumed to be the destination's currency, and nothing checks this. The cart carries no currency."
        - The threshold is compared against the goods total before delivery. No discounts exist today, but they would affect which total should count.
        - "Should the threshold be visible to callers (for \"spend X more for free delivery\" messages), either in `DeliveryQuote` or through a new exported function? Out of scope unless asked."
        - "Existing risks, not introduced by this task: nothing checks at runtime for an unknown country (it returns `undefined` below the threshold), and `goodsCents` is not validated (a negative number or NaN passes)."
        - "The two existing DE tests hard-code 5000 and 490. They need updating if DE's threshold changes."
      artifacts:
        - path: analysis/codebase-analysis.md
          label: Codebase analysis
          html: null
      status: completed
    clarifications:
      node: codebase-analysis
      summary: "Four clarifications resolved: 20 EUR (DE/AT/NL), 20 CHF (CH), 85 PLN (PL) as integer minor units; every country has a threshold; inclusive boundary; threshold stays internal."
      decisions:
        - decision: "Thresholds: DE/AT/NL 2000 EUR cents, CH 2000 rappen (20 CHF), PL 8500 grosze (85 PLN)"
          rationale: operator set 20 EUR and accepted the ≈20 EUR conversion for CH and PL
        - decision: "Every country has a threshold (`Record<Country, number>`), no \"never free\" entry"
          rationale: simplest, compiler-enforced, and no country needs it today
        - decision: "Boundary stays inclusive: a goods total exactly at the threshold ships free"
          rationale: "matches today's behaviour and customer expectation"
        - decision: "The threshold is not exposed to callers: `quoteDelivery` signature and `DeliveryQuote` shape unchanged"
          rationale: no caller needs it yet
      risks:
        - "Lowering DE/AT/NL from 50 EUR to 20 EUR is a behaviour change: orders between 20 and 50 EUR now ship free, and the two existing DE tests (2999 → 490, 5000 → 0) must be updated"
      artifacts:
        - path: analysis/clarifications.md
          label: Clarifications
          html: null
      status: completed
    gap_analysis:
      node: gap-analysis
      summary: "Small, low-risk modificative gap: replace the global threshold with a per-country table in src/delivery-quote.ts; public signature and types unchanged; existing DE threshold tests must be rewritten."
      integration_points:
        - "src/delivery-quote.ts:24-25 — replace FREE_FROM_CENTS with a module-private Readonly<Record<Country, number>> (DE/AT/NL 2000, CH 2000, PL 8500) next to BASE_RATES"
        - "src/delivery-quote.ts:38 — swap the inline `goodsCents >= FREE_FROM_CENTS` for an extracted predicate (e.g. shipsFree(country, goodsCents)); the returned {...rate, cents: 0} / rate is unchanged"
        - "src/delivery-quote.ts:27-30 — update the quoteDelivery JSDoc"
        - test/delivery-quote.test.ts — rewrite both threshold tests; add per-country boundary tests and a test that a free quote keeps currency and days
        - "Not touched: src/cart.ts, src/payment-methods.ts, DeliveryQuote, DeliveryAddress, Country"
      decisions:
        - decision: "Classified as modifies_existing_code only (change type: modificative)"
          rationale: the threshold logic already exists at line 38. Only its data changes, from global to per-country.
        - decision: has_reproducible_defect set to false
          rationale: the 50-PLN/50-CHF currency mismatch is a latent flaw fixed as a side effect. Nobody reported a failure, so no defect-reproduction module runs.
        - decision: involves_data_operations and ui_heavy set to false
          rationale: the thresholds are compile-time constants with no create, update or delete path, and the service has no UI layer.
        - decision: "Compatibility requirement is \"moderate\""
          rationale: exported types and the `quoteDelivery` signature stay strictly unchanged, and the change in quoted amounts is intended.
      risks:
        - "PL gets stricter: orders from 50.00 to 84.99 PLN that ship free today will cost 19.90 PLN. The clarifications risk lists only the DE/AT/NL reduction, so the operator should know this before release."
        - "CH is also lowered: orders from 20 to 49.99 CHF ship free, where they now cost 12.90 CHF."
        - "`goodsCents` carries no currency. Now that the thresholds differ by currency, a caller passing a EUR total for a PL address would be judged against 8500 grosze. Nothing detects this."
        - "The existing test `refuses a quote without the full address` uses 2999, which is now above the DE threshold. It still passes, because validation throws first, but the value no longer means \"below threshold\"."
        - "Existing gaps this task does not introduce: an unknown country at runtime returns `undefined`, and a negative, fractional or NaN `goodsCents` is accepted."
      artifacts:
        - path: analysis/gap-analysis.md
          label: Gap analysis
          html: null
      status: completed
    scope_clarifications:
      node: gap-analysis
      summary: "No critical scope decisions; three important ones settled on the recommended option. Scope expanded: no."
      scope_expanded: false
      decisions:
        - decision: "Document the goods-total currency contract in the `quoteDelivery` JSDoc (goods total in the destination's minor currency unit)"
          rationale: no production caller exists and the signature was fixed in clarifications
        - decision: Leave the pre-existing unknown-country and `goodsCents` validation gaps out of scope
          rationale: not introduced by this task; types protect typed callers
        - decision: Test all five countries in a loop at threshold − 1 (rate) and at the threshold (free)
          rationale: only a loop over every entry proves the per-country table
      risks:
        - "PL gets stricter: orders from 50.00 to 84.99 PLN that ship free today will cost 19.90 PLN (shown to the operator before these decisions)"
      artifacts:
        - path: analysis/scope-clarifications.md
          label: Scope clarifications
          html: null
      status: completed
    specification:
      node: specification
      summary: "Specification: Free-delivery threshold per country. Per-country threshold table (DE/AT/NL/CH 2000, PL 8500 minor units) and shipsFree predicate in src/delivery-quote.ts; public API unchanged; 6 core requirements, 4 tests. Audit enabled."
      decisions:
        - decision: "Threshold table `FREE_DELIVERY_FROM_CENTS: Readonly<Record<Country, number>>` sits beside `BASE_RATES`, module-private and documented with JSDoc"
          rationale: reuses the existing per-country table pattern, and the compiler forces one entry per country
        - decision: Predicate `shipsFree(country, goodsCents)` is module-private and returns `goodsCents >= FREE_DELIVERY_FROM_CENTS[country]`
          rationale: "\"extract rather than branch\", and it is named for what it returns"
        - decision: "`FREE_FROM_CENTS` and its JSDoc are deleted"
          rationale: no dead code
        - decision: The two existing DE threshold tests are rewritten in place as the two per-country loops, keeping their names; the loops contain DE 1999 → 490 and DE 2000 → 0
          rationale: one behaviour per test with no duplicate DE-only copy
        - decision: Expected thresholds and rates are written out as literals in the test, not imported
          rationale: the table stays private, and the test checks the operator-confirmed values on their own terms
        - decision: The missing-address test uses 1999 (below the DE threshold)
          rationale: "the fixture keeps its meaning of \"below threshold\""
        - decision: Specification audit enabled
          rationale: operator chose the recommended option at the audit opt-in
      risks:
        - "PL gets stricter: orders from 50.00 to 84.99 PLN that ship free today will cost 19.90 PLN. Tell the business before release."
        - "CH, DE, AT and NL get more generous: orders from 20.00 to 49.99 in the local currency now ship free, where they cost the base rate before."
        - "`goodsCents` carries no currency, and the contract is documented in JSDoc only. A caller passing a total in the wrong currency gets a silently wrong result."
        - "Gaps that exist today and remain: an unknown country at runtime returns `undefined`, and a negative, fractional or NaN `goodsCents` is accepted."
      artifacts:
        - path: implementation/spec.md
          label: Specification
          html: implementation/spec.html
        - path: analysis/requirements.md
          label: Requirements
          html: null
      status: completed
    architecture_decision:
      node: specification
      summary: "Single approach, no alternatives: module-private per-country threshold table beside BASE_RATES plus an extracted shipsFree predicate in src/delivery-quote.ts."
      decisions:
        - decision: Single approach, no alternatives presented
          rationale: the codebase analysis and gap analysis converged on one design, and nothing about it is open
      risks: []
      artifacts:
        - path: analysis/technical-clarifications.md
          label: Technical clarifications
          html: null
      status: completed
    spec_audit:
      node: spec-audit
      verdict: pass with concerns
      summary: "Verdict: pass with concerns. 0 critical, 1 warning (no named owner for PL price-increase sign-off), 5 info (loop test failure messages, free-quote shape tested for PL only, fixture data unpinned, unknown-country claim imprecise, suite scope wording)."
      decisions:
        - decision: The PL price increase is rated a warning, not critical
          rationale: "it was decided on purpose and shown to the operator twice (gap_analysis, scope_clarifications). What's missing is a recorded business sign-off before release, not a spec defect."
        - decision: "Reading \"configurable per country\" as compile-time constants is accepted, not flagged"
          rationale: "binding codebase_analysis decision 1 and the answer to requirements Q2 (\"no new module\", confirmed) both settle it."
        - decision: The imprecise unknown-country claim is rated info
          rationale: it comes from the gap analysis, not the spec. It only affects untyped callers, and those guards are out of scope under binding decision 16.
      risks:
        - "Who tells the business about the PL change (orders of 50.00–84.99 PLN that ship free today will cost 19.90 PLN), and when? The spec says \"tell the business before release\" but names no owner and sets no gate."
        - "`goodsCents` still has no currency, and the only safeguard is JSDoc (FR5). Once the first production caller exists, a EUR total passed for a PL address will give a silently wrong quote."
      artifacts:
        - path: verification/spec-audit.md
          label: Specification audit
          html: null
      status: completed
    implementation_plan:
      node: planning
      task_groups: 2
      summary: "2 task groups, 10 steps, low complexity: Group 1 test-first per-country threshold behaviour (FR1–FR4, FR6); Group 2 JSDoc contract (FR5) and compatibility gate (typecheck, full suite 8/8, two files changed)."
      decisions:
        - decision: Two groups, behaviour first and contract second
          rationale: "Group 1 is the test-first behaviour change. Group 2 is the documentation and release gate that CLAUDE.md requires (`pnpm test` + `pnpm typecheck`), so the full-suite run cannot be skipped as \"only the new tests\"."
        - decision: Group 2 adds no test cases; its checks are `pnpm typecheck`, a `FREE_FROM_CENTS` grep and a changed-files check
          rationale: the spec fixes the suite at 4 tests, and JSDoc wording and an unchanged API are proven by the compiler and the diff, not by a unit test.
        - decision: The loop tests pass the country as the assertion message (`expect(actual, country)`)
          rationale: "audit I1: a failing case names its country instead of showing only expected and received values."
        - decision: "Test 3 (\"keeps the currency and delivery days on a free quote\") loops over all five countries with `toEqual` against literal quotes, and the PL case is exactly `{ cents: 0, currency: 'PLN', days: { min: 2, max: 4 } }`"
          rationale: "audit I2: FR2 applies to every country. It stays one test proving one behaviour, so the scope and test count do not grow."
        - decision: The fixtures form one `as const` case table of `{ address, threshold, quote }` literals, one row per country in the order DE, AT, NL, PL, CH
          rationale: "audit I3: the three loop tests share one source of expected values, and the values are still literals, not imports from the private table."
      risks:
        - "Release gate (audit W1): PL gets stricter. Orders from 50.00 to 84.99 PLN that ship free today will cost 19.90 PLN. No owner is named to get business sign-off before release. The plan does not resolve this. The operator must record the sign-off, or record that the scope-clarifications acknowledgement counts as it."
        - "`goodsCents` still carries no currency, and FR5's JSDoc is the only safeguard. A caller that passes a EUR total for a PL address gets a silently wrong quote."
        - "Untyped callers see a behaviour change for an unknown country (audit I4). Today a total of at least 5000 returns `{ cents: 0 }`. After the change the function always returns `undefined`. Runtime guards stay out of scope (decision 16)."
      artifacts:
        - path: implementation/implementation-plan.md
          label: Implementation plan
          html: implementation/implementation-plan.html
      status: completed
