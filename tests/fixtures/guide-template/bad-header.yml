# A guide template lint sample: a second paragraph stands under the H1 (check 2).
name: bad-header
version: 1
description: "Scopes a note, drafts it, asks to continue, and wraps up."

brief:
  scope:
    budget: 2
    questions:
      tone: "A plain tone."

nodes:
  scope:
    uses: direct:scope
    needs: []
    outputs:
      artifacts:
        scope_notes: analysis/scope.md

  draft:
    uses: direct:draft
    needs: [scope]
    outputs:
      artifacts:
        notes: drafts/notes.md

  approval:
    type: gate
    needs: [draft]
    ask: "Draft complete. Continue?"
    options:
      continue-to-wrap-up: continue
      revise-draft: {effect: revise, reruns: draft}
      stop-here: stop

  wrap-up:
    uses: direct:wrap-up
    needs: [approval]
